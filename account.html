<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" />
  <meta name="apple-mobile-web-app-title" content="مساعد المفتش" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <title>حسابي</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://twbatrsenepuaylyiqsq.supabase.co" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>حسابي</h1>
    <div class="user-info">
      <button id="backBtn" class="icon-back-btn" aria-label="رجوع">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
      </button>
    </div>
  </header>

  <div class="main">
    <div class="field">
      <label for="fullNameInput">الاسم الثلاثي</label>
      <input type="text" id="fullNameInput" />
    </div>
    <button id="saveNameBtn">حفظ</button>
    <div class="error" id="nameError"></div>
    <div class="success" id="nameSuccess"></div>

    <div class="field" style="margin-top:24px">
      <label>البريد الإلكتروني</label>
      <div class="readonly-value" id="emailValue"></div>
    </div>

    <div class="field">
      <label>نوع الحساب</label>
      <div class="readonly-value" id="roleValue"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    document.getElementById("backBtn").addEventListener("click", () => {
      window.history.back();
    });

    function roleLabel(role) {
      if (role === "owner") return "مالك النظام";
      if (role === "admin") return "مشرف";
      return "مفتش";
    }

    document.getElementById("saveNameBtn").addEventListener("click", async () => {
      const name = document.getElementById("fullNameInput").value.trim();
      const nameError = document.getElementById("nameError");
      const nameSuccess = document.getElementById("nameSuccess");
      nameError.textContent = "";
      nameSuccess.textContent = "";
      if (!name) {
        nameError.textContent = "اكتب اسمك الثلاثي";
        return;
      }
      const btn = document.getElementById("saveNameBtn");
      btn.disabled = true;
      try {
        await setMyName(name);
        nameSuccess.textContent = "تم الحفظ ✓";
      } catch (e) {
        nameError.textContent = e.message || "تعذّر حفظ الاسم";
      } finally {
        btn.disabled = false;
      }
    });

    (async () => {
      const profile = await requireAuth();
      if (!profile) return;

      document.getElementById("fullNameInput").value = profile.full_name || "";
      document.getElementById("emailValue").textContent = profile.email;
      document.getElementById("roleValue").textContent = roleLabel(profile.role);
    })();
  </script>
</body>
</html>
