<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة المشرف — مساعد المفتش</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>لوحة المشرف</h1>
    <div class="user-info">
      <label class="ios-toggle">
        <span class="toggle-label">وضع المفتش</span>
        <input type="checkbox" id="inspectorModeToggle" />
        <span class="toggle-slider"></span>
      </label>
      <button id="logoutBtn" class="secondary">خروج</button>
    </div>
  </header>

  <div class="main">
    <h2>الأقسام</h2>
    <!-- هنا تُعرض كل الأقسام كمربعات + مربع "إضافة قسم جديد" بالنهاية -->
    <div class="categories-grid" id="categoriesGrid"></div>
  </div>
  <div class="bottom-nav-spacer"></div>

  <!-- ==================== الشريط السفلي (قوائم لوحة المشرف) ==================== -->
  <nav class="bottom-nav">
    <a href="circulars-admin.html"><span class="nav-icon">📢</span>التعاميم</a>
    <a href="tools-admin.html"><span class="nav-icon">🛠️</span>الأدوات المساعدة</a>
  </nav>

  <!-- ==================== النافذة المنبثقة لإضافة/تعديل قسم ====================
       نفس النافذة تُستخدم للحالتين (إضافة وتعديل)، تتغيّر عناوينها بالـ JS ========= -->
  <div class="modal-overlay" id="categoryModal" style="display:none">
    <div class="modal-box">
      <h3 id="modalTitle">إضافة قسم جديد</h3>

      <div class="field">
        <label for="categoryName">اسم القسم</label>
        <input type="text" id="categoryName" placeholder="مثال: صحي" />
      </div>

      <!-- إرفاق أيقونة/صورة للقسم — اختياري، لو تُرك فارغًا يظهر رمز افتراضي ❔ -->
      <div class="field" id="uploadField">
        <label for="categoryFile">إرفاق أيقونة (اختياري)</label>
        <input type="file" id="categoryFile" accept="image/*" />
      </div>

      <div class="error" id="modalError"></div>

      <div class="modal-actions">
        <button id="saveCategoryBtn">حفظ</button>
        <button class="secondary" id="cancelCategoryBtn">إلغاء</button>
      </div>

      <!-- زر الحذف يظهر فقط عند التعديل (مو عند الإضافة) -->
      <div class="center" style="margin-top:10px">
        <button class="link-btn" id="deleteCategoryBtn" style="display:none;color:#b91c1c">حذف هذا القسم</button>
      </div>
    </div>
  </div>

  <!-- ترتيب التحميل: config.js (اتصال Supabase) ثم auth.js (المصادقة) ثم categories.js (دوال الأقسام) -->
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="image-utils.js"></script>
  <script src="categories.js"></script>
  <script src="lists.js"></script>
  <script src="items.js"></script>
  <script src="cases.js"></script>
  <script>
    // ==================================================================
    // متغيرات تتبع حالة النافذة المنبثقة
    // ==================================================================
    let editingCategoryId = null;    // null = وضع إضافة، غير null = وضع تعديل (قيمته id القسم)
    let categoriesCache = [];        // نسخة محلية من الأقسام — نعدّلها مباشرة بدل إعادة الجلب من الخادم في كل مرة

    const grid = document.getElementById("categoriesGrid");
    const modal = document.getElementById("categoryModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalError = document.getElementById("modalError");
    const deleteCategoryBtn = document.getElementById("deleteCategoryBtn");

    // ==================================================================
    // السحب والإفلات لإعادة الترتيب (يشتغل باللمس والماوس عبر Pointer Events)
    // handleEl: مقبض السحب، cardEl: البطاقة نفسها، arrayRef: المصفوفة المحلية
    // persistFn: دالة تحفظ الترتيب الجديد بقاعدة البيانات بعد ما ينتهي السحب
    // ==================================================================
    function attachDragHandle(handleEl, cardEl, arrayRef, persistFn) {
      handleEl.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const pointerId = e.pointerId;
        handleEl.setPointerCapture(pointerId);
        cardEl.classList.add("dragging-card");

        function onMove(ev) {
          const x = ev.clientX, y = ev.clientY;
          const grid = cardEl.parentElement;
          // نلقى أقرب بطاقة تانية (غير البطاقة المسحوبة نفسها ومربع "إضافة")
          const siblings = Array.from(grid.children).filter(
            (el) => el !== cardEl && el.classList.contains("category-card")
          );
          let closest = null;
          let closestDist = Infinity;
          siblings.forEach((sib) => {
            const r = sib.getBoundingClientRect();
            const dist = Math.hypot(r.left + r.width / 2 - x, r.top + r.height / 2 - y);
            if (dist < closestDist) { closestDist = dist; closest = sib; }
          });
          if (closest) {
            const children = Array.from(grid.children);
            const cardIndex = children.indexOf(cardEl);
            const closestIndex = children.indexOf(closest);
            if (cardIndex > closestIndex) grid.insertBefore(cardEl, closest);
            else grid.insertBefore(cardEl, closest.nextSibling);
          }
        }

        function onUp() {
          handleEl.releasePointerCapture(pointerId);
          handleEl.removeEventListener("pointermove", onMove);
          handleEl.removeEventListener("pointerup", onUp);
          cardEl.classList.remove("dragging-card");

          // نحدّد الترتيب الجديد من ترتيب البطاقات الفعلي بالـ DOM الآن، ونحفظه
          const grid = cardEl.parentElement;
          const newOrderIds = Array.from(grid.children)
            .filter((el) => el.classList.contains("category-card"))
            .map((el) => el.dataset.id);
          arrayRef.sort((a, b) => newOrderIds.indexOf(a.id) - newOrderIds.indexOf(b.id));
          arrayRef.forEach((item, idx) => { item.sort_order = idx; });
          persistFn(arrayRef);
        }

        handleEl.addEventListener("pointermove", onMove);
        handleEl.addEventListener("pointerup", onUp);
      });
    }

    // -------------------------------------------------
    // تحفظ الترتيب الجديد للأقسام بقاعدة البيانات بعد انتهاء السحب
    // -------------------------------------------------
    async function persistCategoryOrder(items) {
      let report = "";
      for (const item of items) {
        try {
          const data = await updateCategorySortOrder(item.id, item.sort_order);
          report += `${item.name}: ترتيب جديد=${item.sort_order} — الصفوف المتأثرة: ${data.length}\n`;
        } catch (e) {
          report += `${item.name}: خطأ — ${e.message}\n`;
        }
      }
      alert(report); // ============ تشخيصي مؤقت ============
    }

    // -------------------------------------------------
    // جلب الأقسام من الخادم (تُستدعى مرة وحدة فقط عند فتح الصفحة)
    // -------------------------------------------------
    async function loadCategories() {
      grid.innerHTML = "<p>جارٍ التحميل...</p>";
      categoriesCache = await fetchCategories();
      renderCategories();
    }

    // -------------------------------------------------
    // رسم شبكة الأقسام من النسخة المحلية (categoriesCache) بدون أي اتصال بالخادم
    // تُستدعى بعد أي إضافة/تعديل/حذف عشان الاستجابة تكون فورية
    // -------------------------------------------------
    function renderCategories() {
      grid.innerHTML = "";

      categoriesCache.forEach((cat) => {
        const card = document.createElement("div");
        card.className = "category-card";
        card.dataset.id = cat.id; // نستخدمه بعد السحب لمعرفة الترتيب الجديد فعليًا من الـ DOM
        card.style.cursor = "pointer";
        // الضغط على المربع نفسه (الصورة/الاسم) يفتح صفحة القوائم الخاصة بهذا القسم
        card.addEventListener("click", () => {
          window.location.href = `lists.html?category_id=${cat.id}`;
        });

        // مقبض السحب لإعادة الترتيب — يمسك منه بس (مو من أي مكان بالبطاقة)
        const handle = document.createElement("div");
        handle.className = "drag-handle";
        handle.textContent = "⠿";
        handle.addEventListener("click", (e) => e.stopPropagation());
        attachDragHandle(handle, card, categoriesCache, persistCategoryOrder);
        card.appendChild(handle);

        const visual = document.createElement("div");
        visual.className = "category-visual";
        if (cat.image_type === "upload" && cat.image_value) {
          visual.innerHTML = `<img src="${cat.image_value}" alt="${cat.name}" />`;
        } else {
          visual.innerHTML = `<span class="icon-text">${cat.image_value || "❔"}</span>`;
        }

        const name = document.createElement("div");
        name.className = "category-name";
        name.textContent = cat.name;

        const actions = document.createElement("div");
        actions.className = "category-actions";
        actions.innerHTML = `
          <button class="secondary edit-btn">تعديل</button>
        `;
        actions.querySelector(".edit-btn").addEventListener("click", (e) => {
          e.stopPropagation(); // يمنع تفعيل ضغطة المربع نفسه (اللي يفتح صفحة القوائم)
          openEditModal(cat);
        });

        card.appendChild(visual);
        card.appendChild(name);
        card.appendChild(actions);
        grid.appendChild(card);
      });

      // مربع "إضافة قسم جديد" دائمًا بآخر الشبكة
      const addCard = document.createElement("div");
      addCard.className = "add-category-card";
      addCard.textContent = "+ إضافة قسم جديد";
      addCard.addEventListener("click", openAddModal);
      grid.appendChild(addCard);
    }

    // -------------------------------------------------
    // فتح النافذة بوضع "إضافة"
    // -------------------------------------------------
    function openAddModal() {
      editingCategoryId = null;
      modalTitle.textContent = "إضافة قسم جديد";
      document.getElementById("categoryName").value = "";
      document.getElementById("categoryFile").value = "";
      modalError.textContent = "";
      deleteCategoryBtn.style.display = "none";
      modal.style.display = "flex";
    }

    // -------------------------------------------------
    // فتح النافذة بوضع "تعديل" مع تعبئة بيانات القسم الحالي
    // -------------------------------------------------
    function openEditModal(cat) {
      editingCategoryId = cat.id;
      modalTitle.textContent = "تعديل القسم";
      document.getElementById("categoryName").value = cat.name;
      document.getElementById("categoryFile").value = "";
      modalError.textContent = "";
      deleteCategoryBtn.style.display = "inline-block";
      modal.style.display = "flex";
    }

    // -------------------------------------------------
    // إغلاق النافذة
    // -------------------------------------------------
    document.getElementById("cancelCategoryBtn").addEventListener("click", () => {
      modal.style.display = "none";
    });

    // -------------------------------------------------
    // حفظ (إضافة أو تعديل حسب editingCategoryId)
    // الصورة اختيارية دائمًا — لو ما اختار المشرف ملف يُحفظ القسم بدون صورة
    // ويظهر رمز افتراضي ❔ مكانها (التعامل مع هذا موجود بدالة renderCategories)
    // -------------------------------------------------
    document.getElementById("saveCategoryBtn").addEventListener("click", async () => {
      modalError.textContent = "";
      const name = document.getElementById("categoryName").value.trim();
      const file = document.getElementById("categoryFile").files[0];

      if (!name) {
        modalError.textContent = "اكتب اسم القسم";
        return;
      }

      const saveBtn = document.getElementById("saveCategoryBtn");
      saveBtn.disabled = true; // يمنع تكرار الضغط والتسبب بإضافة القسم أكثر من مرة
      try {
        if (editingCategoryId) {
          // وضع تعديل: لو ما اختار ملف جديد، تبقى الصورة القديمة كما هي
          const oldCategory = categoriesCache.find((c) => c.id === editingCategoryId);
          const oldImageUrl = oldCategory ? oldCategory.image_value : null;
          const updated = await updateCategory(editingCategoryId, { name, image_type: "upload", file });
          // لو رفع صورة جديدة فعلاً، نحذف الصورة القديمة من التخزين عشان ما تضل يتيمة بدون فائدة
          if (file && oldImageUrl) await deleteCategoryImageFile(oldImageUrl);
          // نحدّث الصف بالنسخة المحلية مباشرة بدل إعادة جلب كل الأقسام من الخادم
          const index = categoriesCache.findIndex((c) => c.id === editingCategoryId);
          if (index !== -1) categoriesCache[index] = updated;
        } else {
          // وضع إضافة: نضيف الصف الجديد اللي رجع من الخادم للنسخة المحلية مباشرة
          const created = await addCategory({ name, image_type: "upload", file });
          categoriesCache.push(created);
        }
        modal.style.display = "none";
        renderCategories(); // رسم فوري من النسخة المحلية، بدون انتظار اتصال إضافي بالخادم
      } catch (e) {
        modalError.textContent = e.message || "حدث خطأ أثناء الحفظ";
      } finally {
        saveBtn.disabled = false;
      }
    });

    // -------------------------------------------------
    // حذف القسم الحالي (يظهر فقط بوضع التعديل)
    // -------------------------------------------------
    deleteCategoryBtn.addEventListener("click", async () => {
      if (!editingCategoryId) return;
      const confirmed = confirm("هل أنت متأكد من حذف هذا القسم؟ سيُحذف معه كل البنود والحالات التابعة له.");
      if (!confirmed) return;

      try {
        const category = categoriesCache.find((c) => c.id === editingCategoryId);

        // تنظيف عميق: نجلب كل قوائم القسم، وكل بنود كل قائمة، ونحذف صور حالات كل بند من التخزين
        const lists = await fetchLists(editingCategoryId);
        for (const list of lists) {
          const items = await fetchItems(list.id);
          for (const item of items) {
            await deleteAllCaseImagesForItem(item.id);
          }
        }

        await deleteCategory(editingCategoryId);
        // نحذف صورة القسم فعليًا من التخزين أيضًا، بعد ما نتأكد إن حذف الصف نجح
        if (category && category.image_value) await deleteCategoryImageFile(category.image_value);
        // نحذف الصف من النسخة المحلية مباشرة بدل إعادة جلب كل الأقسام من الخادم
        categoriesCache = categoriesCache.filter((c) => c.id !== editingCategoryId);
        modal.style.display = "none";
        renderCategories();
      } catch (e) {
        modalError.textContent = e.message || "تعذر حذف القسم";
      }
    });

    // ==================================================================
    // تشغيل الصفحة: التحقق من صلاحية المشرف، ثم عرض الأقسام
    // ==================================================================
    (async () => {
      const profile = await requireAuth({ adminOnly: true });

      document.getElementById("inspectorModeToggle").addEventListener("change", () => {
        window.location.href = "index.html";
      });
      document.getElementById("logoutBtn").addEventListener("click", logout);

      await loadCategories();
    })();
  </script>
</body>
</html>
