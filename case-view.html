<script>
  document.getElementById("hamburgerBtn").addEventListener("click", () => {
    document.getElementById("drawerOverlay").style.display = "block";
    document.getElementById("sideDrawer").classList.add("open");
  });
  function closeSideDrawer() {
    document.getElementById("drawerOverlay").style.display = "none";
    document.getElementById("sideDrawer").classList.remove("open");
  }
  document.getElementById("closeDrawerBtn").addEventListener("click", closeSideDrawer);
  document.getElementById("drawerOverlay").addEventListener("click", closeSideDrawer);
  document.getElementById("syncBtn").addEventListener("click", () => location.reload());
  document.getElementById("drawerLogoutBtn").addEventListener("click", () => logout());
</script>


  <div class="main" style="padding-bottom:8px">
    <h2 id="itemTitle" style="margin-top:16px"></h2>
    <div class="case-acc-list" id="casesGrid"></div>
  </div>
  <div class="bottom-nav-spacer"></div>

  <!-- ==================== الشريط السفلي ==================== -->

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="items.js"></script>
  <script src="cases.js"></script>
  <script src="case-accordion.js"></script>
  <script src="circulars.js"></script>
  <script src="bottom-nav.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const itemId = urlParams.get("item_id");

    let allCases = [];
    const grid = document.getElementById("casesGrid");

    // -------------------------------------------------
    // رسم شبكة الحالات (قراءة فقط)
    // -------------------------------------------------
    function renderCases() {
      grid.innerHTML = "";

      if (allCases.length === 0) {
        grid.innerHTML = '<div class="empty-hint">لا توجد حالات لهذا البند بعد.</div>';
        return;
      }

      allCases.forEach((c) => grid.appendChild(buildCaseAccordion(c)));
    }

    // ==================================================================
    // تشغيل الصفحة
    // ==================================================================
    (async () => {
      await requireAuth(); // أي مستخدم مسجل دخول (زائر أو مشرف)

      if (!itemId) {
        document.getElementById("itemTitle").textContent = "لم يتم تحديد بند";
        return;
      }

      const item = await fetchItemById(itemId);
      document.getElementById("itemTitle").textContent = item.name;

      document.getElementById("backBtn").addEventListener("click", () => {
        window.history.back();
      });

      allCases = await fetchCases(itemId);
      renderCases();
      updateCircularsNavDot();
    })();
  </script>
</body>
</html>
