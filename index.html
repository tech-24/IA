<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" />
  <meta name="apple-mobile-web-app-title" content="مساعد المفتش" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <title>مساعد المفتش</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://twbatrsenepuaylyiqsq.supabase.co" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- ==================== الشريط العلوي ==================== -->
  <header>
    <h1>مساعد المفتش</h1>
    <div class="user-info">
      <!-- المفتاح وكلمة "مشرف" بعمود واحد (المفتاح فوق، الكلمة تحته)
           الشارة تظل تظهر للزائر برضو (بدون مفتاح فوقها لأنه يظهر للمشرف فقط) -->
      <div class="toggle-badge-col">
        <label class="ios-toggle" id="inspectorModeWrap" style="display:none">
          <span class="toggle-label">وضع المفتش</span>
          <input type="checkbox" id="inspectorModeToggle" checked />
          <span class="toggle-slider"></span>
        </label>
        <span class="badge" id="roleBadge"></span>
      </div>
      <button id="logoutBtn" class="secondary">خروج</button>
    </div>
  </header>

  <!-- ==================== المحتوى الرئيسي ====================
       عرض الأقسام (قراءة فقط) — البنود والحالات تُضاف بخطوة لاحقة
       عند الضغط على قسم ============================================= -->
  <div class="main">
    <!-- حقل بحث عن بند بالاسم — يشتغل فوري وانت تكتب، ويخفي شبكة الأقسام مؤقتًا -->
    <div class="field" style="margin-bottom:10px">
      <input type="text" id="itemSearchInput" placeholder="ابحث عن بند بالاسم..." />
    </div>

    <div id="searchResults" style="display:none"></div>

    <div id="categoriesSection">
      <h2>الأقسام</h2>
      <div class="categories-grid" id="categoriesGrid"></div>
    </div>
  </div>
  <div class="bottom-nav-spacer"></div>

  <!-- ==================== الشريط السفلي ==================== -->
  <nav class="bottom-nav">
    <a href="index.html" class="active"><span class="nav-icon">📋</span>البنود</a>
    <a href="circulars.html"><span class="nav-icon">📢</span>تعاميم</a>
    <a href="tools.html"><span class="nav-icon">🛠️</span>أدوات مساعدة</a>
  </nav>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="categories.js"></script>
  <script src="items.js"></script>
  <script src="circulars.js"></script>
  <script src="bottom-nav.js"></script>
  <script>
    // -------------------------------------------------
    // عرض الأقسام كمربعات للقراءة فقط (بدون أزرار تعديل/حذف)
    // -------------------------------------------------
    async function renderCategoriesReadOnly() {
      const grid = document.getElementById("categoriesGrid");
      grid.innerHTML = "<p>جارٍ التحميل...</p>";

      const categories = await fetchCategories(); // نفس الدالة المستخدمة بلوحة المشرف
      grid.innerHTML = "";

      if (categories.length === 0) {
        grid.innerHTML = "<p>لا توجد أقسام بعد.</p>";
        return;
      }

      categories.forEach((cat) => {
        const card = document.createElement("div");
        card.className = "category-card";
        card.style.cursor = "pointer";

        const visual = document.createElement("div");
        visual.className = "category-visual";
        if (cat.image_type === "upload" && cat.image_value) {
          visual.innerHTML = `<img src="${cat.image_value}" alt="${cat.name}" />`;
        } else {
          visual.innerHTML = `<span class="icon-text">${cat.image_value || "❔"}</span>`;
        }

        const name = document.createElement("div");
        name.className = "category-name";
        name.textContent = cat.name;

        card.appendChild(visual);
        card.appendChild(name);

        // بخطوة لاحقة: الضغط على القسم بيوديك لصفحة البنود الخاصة فيه
        card.addEventListener("click", () => {
          window.location.href = `lists-view.html?category_id=${cat.id}`;
        });

        grid.appendChild(card);
      });
    }

    // -------------------------------------------------
    // البحث عن بند بالاسم — فوري وانت تكتب، مع تأخير بسيط (debounce)
    // عشان ما نرسل طلب لكل حرف، بس فرق زمني قصير جدًا بعد آخر ضغطة
    // -------------------------------------------------
    const searchInput = document.getElementById("itemSearchInput");
    const searchResultsEl = document.getElementById("searchResults");
    const categoriesSectionEl = document.getElementById("categoriesSection");
    let searchDebounceTimer = null;

    function renderSearchResults(items) {
      searchResultsEl.innerHTML = "";

      if (items.length === 0) {
        searchResultsEl.innerHTML = '<div class="empty-hint">ما فيه بنود بهذا الاسم.</div>';
        return;
      }

      const list = document.createElement("div");
      list.className = "items-list";

      items.forEach((item) => {
        const row = document.createElement("div");
        row.className = "item-row" + (item.is_suspended ? " item-suspended" : "");

        const categoryName = item.list && item.list.category ? item.list.category.name : "";
        const listName = item.list ? item.list.name : "";

        row.innerHTML = `
          <div>
            <div class="item-name">${item.name}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${categoryName} › ${listName}</div>
          </div>
        `;
        row.addEventListener("click", () => {
          window.location.href = `case-view.html?item_id=${item.id}`;
        });
        list.appendChild(row);
      });

      searchResultsEl.appendChild(list);
    }

    searchInput.addEventListener("input", () => {
      const query = searchInput.value.trim();

      clearTimeout(searchDebounceTimer);

      if (!query) {
        // الحقل فاضي: نرجّع شبكة الأقسام العادية ونخفي نتائج البحث
        searchResultsEl.style.display = "none";
        categoriesSectionEl.style.display = "block";
        return;
      }

      searchDebounceTimer = setTimeout(async () => {
        categoriesSectionEl.style.display = "none";
        searchResultsEl.style.display = "block";
        searchResultsEl.innerHTML = "<p>جارٍ البحث...</p>";
        const results = await searchItems(query);
        renderSearchResults(results);
      }, 250);
    });

    // ==================================================================
    // تشغيل الصفحة: التحقق من تسجيل الدخول، ثم عرض الأقسام
    // ==================================================================
    (async () => {
      // requireAuth() بدون adminOnly = يسمح لأي مستخدم مسجل دخول (زائر أو مشرف)
      const profile = await requireAuth();

      const roleBadge = document.getElementById("roleBadge");
      if (profile.role === "admin") {
        // نخفي الشارة للمشرف لأن مفتاح "وضع المفتش" أصلاً يدل إنه مشرف، وتكرار الكلمة زيادة بدون داعي
        roleBadge.style.display = "none";
        document.getElementById("inspectorModeWrap").style.display = "flex";
      } else {
        roleBadge.textContent = "مفتش";
      }

      // تعطيل المفتاح (لأنه مفعّل افتراضيًا) يرجّع المشرف للوحة المشرف
      document.getElementById("inspectorModeToggle").addEventListener("change", (e) => {
        if (!e.target.checked) {
          window.location.href = "admin.html";
        }
      });
      document.getElementById("logoutBtn").addEventListener("click", logout);

      await renderCategoriesReadOnly();
      updateCircularsNavDot(); // لا داعي لانتظاره، يضيف النقطة لما يخلص بدون ما يؤخر عرض الأقسام
    })();
  </script>
</body>
</html>
