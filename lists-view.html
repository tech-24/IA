<script>
  document.getElementById("hamburgerBtn").addEventListener("click", () => {
    document.getElementById("drawerOverlay").style.display = "block";
    document.getElementById("sideDrawer").classList.add("open");
  });
  function closeSideDrawer() {
    document.getElementById("drawerOverlay").style.display = "none";
    document.getElementById("sideDrawer").classList.remove("open");
  }
  document.getElementById("closeDrawerBtn").addEventListener("click", closeSideDrawer);
  document.getElementById("drawerOverlay").addEventListener("click", closeSideDrawer);
  document.getElementById("syncBtn").addEventListener("click", () => location.reload());
  document.getElementById("drawerLogoutBtn").addEventListener("click", logout);
</script>


  <div class="main" style="padding-bottom:8px">

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="categories.js"></script>
  <script src="lists.js"></script>
  <script src="items.js"></script>
  <script src="circulars.js"></script>
  <script src="bottom-nav.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const categoryId = urlParams.get("category_id");

    let allLists = [];
    let activeListId = null;

    const listsTabs = document.getElementById("listsTabs");
    const activeListNameEl = document.getElementById("activeListName");
    const itemsListEl = document.getElementById("itemsList");

    // -------------------------------------------------
    // رسم شريط التبويبات (قراءة فقط، بدون تبويب إضافة)
    // -------------------------------------------------
    function renderTabs() {
      listsTabs.innerHTML = "";
      allLists.forEach((list) => {
        const tab = document.createElement("div");
        tab.className = "list-tab" + (list.id === activeListId ? " active" : "");
        tab.textContent = list.name;
        tab.addEventListener("click", async () => {
          activeListId = list.id;
          renderTabs();
          await renderItems();
        });
        listsTabs.appendChild(tab);
      });
    }

    // -------------------------------------------------
    // رسم بنود القائمة النشطة — البند الموقوف رمادي ومشطوب
    // الضغط على أي بند يفتح صفحة حالاته
    // -------------------------------------------------
    async function renderItems() {
      if (!activeListId) return;
      const activeList = allLists.find((l) => l.id === activeListId);
      activeListNameEl.textContent = activeList.name;

      itemsListEl.innerHTML = "<p>جارٍ التحميل...</p>";
      const items = await fetchItems(activeListId);
      itemsListEl.innerHTML = "";

      if (items.length === 0) {
        itemsListEl.innerHTML = '<div class="empty-hint">لا توجد بنود بهذه القائمة بعد.</div>';
        return;
      }

      items.forEach((item) => {
        const row = document.createElement("div");
        row.className = "item-row" + (item.is_suspended ? " item-suspended" : "");
        row.innerHTML = `<span class="item-name">${escapeHtml(item.name)}</span>`;
        row.addEventListener("click", () => {
          window.location.href = `case-view.html?item_id=${item.id}`;
        });
        itemsListEl.appendChild(row);
      });
    }

    async function loadLists() {
      allLists = await fetchLists(categoryId);
      if (allLists.length > 0) activeListId = allLists[0].id;
      renderTabs();
      await renderItems();
    }

    // ==================================================================
    // تشغيل الصفحة
    // ==================================================================
    (async () => {
      await requireAuth(); // أي مستخدم مسجل دخول (زائر أو مشرف)

      if (!categoryId) {
        document.getElementById("categoryTitle").textContent = "لم يتم تحديد قسم";
        return;
      }

      const category = await fetchCategoryById(categoryId);
      document.getElementById("categoryTitle").textContent = category.name;

      document.getElementById("backHomeBtn").addEventListener("click", () => {
        window.history.back();
      });

      await loadLists();
      updateCircularsNavDot();
    })();
  </script>
</body>
</html>
