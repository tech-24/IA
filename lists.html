  <script>
    // ==================================================================
    // قراءة رقم القسم من رابط الصفحة (?category_id=...)
    // ==================================================================
    const urlParams = new URLSearchParams(window.location.search);
    const categoryId = urlParams.get("category_id");

    // متغيرات الحالة
    let allLists = [];          // كل قوائم هذا القسم (نسخة محلية، نعدّلها مباشرة)
    let activeListId = null;    // القائمة المفتوحة حاليًا (التبويب النشط)
    let editingListId = null;   // القائمة اللي يتم تعديلها بالنافذة المنبثقة
    let editingItemId = null;   // البند اللي يتم تعديله بالنافذة المنبثقة
    let itemsCacheByList = {};  // { listId: [items] } — بنود كل قائمة تُجلب مرة وحدة وتُخزّن هنا
    let allTypes = [];          // أنواع منشآت هذا القسم (حلاق، مغسلة...)
    let typesAvailable = false; // هل جدول الأنواع جاهز بقاعدة البيانات؟
    let selectedTypeIds = [];   // أنواع المنشآت المحددة للبند الجاري تعديله بالنافذة

    // اسم نوع المنشأة من معرّفه
    function typeNameById(id) {
      const t = allTypes.find((x) => x.id === id);
      return t ? t.name : null;
    }

    const listsTabs = document.getElementById("listsTabs");
    const listPanelHeader = document.getElementById("listPanelHeader");
    const reorderStatusEl = document.getElementById("reorderStatus");
    const activeListNameEl = document.getElementById("activeListName");
    const itemsListEl = document.getElementById("itemsList");
    const addItemBtnWrap = document.getElementById("addItemBtnWrap");

    // -------------------------------------------------
    // رسم شريط التبويبات (كل القوائم + تبويب "إضافة قائمة")
    // -------------------------------------------------
    function renderTabs() {
      listsTabs.innerHTML = "";

      allLists.forEach((list) => {
        const tab = document.createElement("div");
        tab.className = "list-tab" + (list.id === activeListId ? " active" : "");
        tab.textContent = list.name;
        tab.addEventListener("click", async () => {
          showReorderStatus("", "");
          activeListId = list.id;
          renderTabs();
          await showListPanel();
        });
        listsTabs.appendChild(tab);
      });

      // تبويب إضافة قائمة جديدة، دائمًا آخر التبويبات
      const addTab = document.createElement("div");
      addTab.className = "list-tab add-list-tab";
      addTab.textContent = "+ قائمة جديدة";
      addTab.addEventListener("click", openAddListModal);
      listsTabs.appendChild(addTab);
    }

    // -------------------------------------------------
    // التأكد من وجود بنود القائمة بالذاكرة المؤقتة — يجلبها من الخادم
    // فقط أول مرة تُفتح فيها هذي القائمة، وبعدها تُستخدم النسخة المحفوظة
    // -------------------------------------------------
    async function ensureItemsLoaded(listId) {
      if (!(listId in itemsCacheByList)) {
        itemsCacheByList[listId] = await fetchItems(listId);
      }
    }

    // -------------------------------------------------
    // عرض لوحة القائمة النشطة: يتأكد من توفر البنود بالذاكرة أولًا، ثم يرسمها
    // -------------------------------------------------
    async function showListPanel() {
      if (!activeListId) {
        listPanelHeader.style.display = "none";
        itemsListEl.innerHTML = "";
        addItemBtnWrap.innerHTML = "";
        return;
      }
      itemsListEl.innerHTML = "<p>جارٍ التحميل...</p>";
      await ensureItemsLoaded(activeListId);
      renderListPanel();
    }

    // -------------------------------------------------
    // رسم لوحة القائمة النشطة (العنوان + البنود) من الذاكرة المؤقتة مباشرة
    // بدون أي اتصال بالخادم — تُستدعى بعد أي إضافة/تعديل/حذف بند
    // -------------------------------------------------
    function renderListPanel() {
      const activeList = allLists.find((l) => l.id === activeListId);
      listPanelHeader.style.display = "flex";
      activeListNameEl.textContent = activeList.name;

      const items = itemsCacheByList[activeListId] || [];
      itemsListEl.innerHTML = "";

      if (items.length === 0) {
        itemsListEl.innerHTML = '<div class="empty-hint">لا توجد بنود بهذه القائمة بعد.</div>';
      }

      items.forEach((item, index) => {
        itemsListEl.appendChild(buildItemRow(item, index, items));
      });

      addItemBtnWrap.innerHTML = "";
      const addBtn = document.createElement("div");
      addBtn.className = "add-item-btn";
      addBtn.textContent = "+ إضافة بند جديد";
      addBtn.addEventListener("click", openAddItemModal);
      addItemBtnWrap.appendChild(addBtn);
    }

    // اسم البند + وسوم أنواع المنشآت المرتبط بها (لا شيء = مشترك للكل)
    function itemMainHtml(item) {
      const badges = (item.item_facility_types || [])
        .map((t) => typeNameById(t.facility_type_id))
        .filter(Boolean)
        .map((n) => `<span class="facility-badge">${escapeHtml(n)}</span>`)
        .join("");
      return `<span class="item-name">${escapeHtml(item.name)}</span>${
        badges ? `<div class="facility-badges">${badges}</div>` : ""
      }`;
    }

    // ==================================================================
    // ترتيب البنود: مقبض سحب ⠿ وسهمان ▲▼ بكل بند، وحفظ تلقائي بعد كل نقل
    // ==================================================================
    const GRIP_SVG = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>';
    const UP_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"></polyline></svg>';
    const DOWN_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';

    // بعد انتهاء سحب نتجاهل أي "ضغطة" متأخرة يولّدها المتصفح، حتى لا تفتح البند بالغلط
    let suppressRowClickUntil = 0;

    // موضع الإفلات: عدد الصفوف الأخرى التي منتصفها أعلى من مركز الصف المسحوب
    function computeDropIndex(mids, draggedIndex, draggedCenter) {
      let target = 0;
      mids.forEach((m, i) => {
        if (i !== draggedIndex && m < draggedCenter) target++;
      });
      return target;
    }

    // إزاحة كل صف أثناء السحب لفتح فراغ مكان الإفلات (الصف المسحوب نفسه يتبع الإصبع)
    function computeOffsets(count, index, target, shift) {
      const offsets = [];
      for (let i = 0; i < count; i++) {
        let offset = 0;
        if (i !== index) {
          if (index < target && i > index && i <= target) offset = -shift;
          else if (index > target && i >= target && i < index) offset = shift;
        }
        offsets.push(offset);
      }
      return offsets;
    }

    // صف البند: [مقبض] [الاسم — الضغط عليه يفتح حالات البند] [أسهم] [تعديل]
    function buildItemRow(item, index, items) {
      const row = document.createElement("div");
      row.className = "item-row" + (item.is_suspended ? " item-suspended" : "");
      row.dataset.id = item.id;

      // المقبض والأسهم تظهر فقط لو فيه بندان أو أكثر
      const canReorder = items.length >= 2;

      if (canReorder) {
        const handle = document.createElement("div");
        handle.className = "reorder-handle";
        handle.setAttribute("aria-label", "اسحب لتغيير الترتيب");
        handle.innerHTML = GRIP_SVG;
        handle.addEventListener("pointerdown", (e) => startDrag(e, index));
        handle.addEventListener("click", (e) => e.stopPropagation()); // الضغط على المقبض ما يفتح البند
        row.appendChild(handle);
      }

      const main = document.createElement("div");
      main.className = "item-main";
      main.innerHTML = itemMainHtml(item);
      row.appendChild(main);

      if (canReorder) {
        const arrows = document.createElement("div");
        arrows.className = "reorder-arrows";

        const up = document.createElement("button");
        up.type = "button";
        up.setAttribute("aria-label", "تحريك للأعلى");
        up.innerHTML = UP_SVG;
        up.disabled = index === 0;
        up.addEventListener("click", (e) => {
          e.stopPropagation();
          moveItem(index, index - 1);
        });

        const down = document.createElement("button");
        down.type = "button";
        down.setAttribute("aria-label", "تحريك للأسفل");
        down.innerHTML = DOWN_SVG;
        down.disabled = index === items.length - 1;
        down.addEventListener("click", (e) => {
          e.stopPropagation();
          moveItem(index, index + 1);
        });

        arrows.appendChild(up);
        arrows.appendChild(down);
        row.appendChild(arrows);
      }

      const editBtn = document.createElement("button");
      editBtn.className = "secondary";
      editBtn.textContent = "تعديل";
      editBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openEditItemModal(item);
      });
      row.appendChild(editBtn);

      // الضغط على الصف نفسه ينقل لصفحة حالات هذا البند
      row.addEventListener("click", () => {
        if (Date.now() < suppressRowClickUntil) return;
        window.location.href = `cases.html?item_id=${item.id}`;
      });

      return row;
    }

    // نقل بند من موضع لآخر بالذاكرة، ثم رسم القائمة وحفظ الترتيب
    function moveItem(from, to) {
      const items = itemsCacheByList[activeListId];
      if (!items || from === to || to < 0 || to >= items.length) return;
      const [moved] = items.splice(from, 1);
      items.splice(to, 0, moved);
      renderListPanel();
      flashRow(moved.id);
      queueSave(activeListId);
    }

    // تظليل مؤقت للبند بعد نقله ليعرف المشرف وين صار
    function flashRow(itemId) {
      const row = itemsListEl.querySelector(`.item-row[data-id="${itemId}"]`);
      if (!row) return;
      row.classList.add("just-moved");
      setTimeout(() => row.classList.remove("just-moved"), 900);
    }

    // ---------- السحب ----------
    // مهم: لا نحرّك عناصر الصفحة (DOM) أثناء السحب، بل نستخدم transform فقط،
    // ونستمع لأحداث الإصبع على window، وننفّذ النقل الفعلي عند الإفلات فقط.
    // هذا يتجنّب مشكلة السحب باللمس اللي ما كانت تسجّل لحظة الإفلات فيما سبق.
    let drag = null;

    function startDrag(e, index) {
      if (drag) return;
      e.preventDefault();
      const rows = Array.from(itemsListEl.querySelectorAll(".item-row"));
      const scrollAtStart = window.scrollY;
      const metrics = rows.map((r) => {
        const b = r.getBoundingClientRect();
        return { top: b.top + scrollAtStart, height: b.height };
      });
      drag = {
        index,
        rows,
        metrics,
        startDocY: e.clientY + scrollAtStart,
        clientY: e.clientY,
        target: index,
        gap: parseFloat(getComputedStyle(itemsListEl).rowGap) || 10,
        raf: null,
      };
      rows[index].classList.add("dragging");
      window.addEventListener("pointermove", onDragMove, { passive: false });
      window.addEventListener("pointerup", onDragEnd);
      window.addEventListener("pointercancel", onDragEnd);
      drag.raf = requestAnimationFrame(autoScrollTick);
    }

    function onDragMove(e) {
      if (!drag) return;
      e.preventDefault();
      drag.clientY = e.clientY;
      updateDrag();
    }

    function updateDrag() {
      const d = drag;
      const dy = d.clientY + window.scrollY - d.startDocY;
      const dragged = d.metrics[d.index];
      const draggedCenter = dragged.top + dragged.height / 2 + dy;
      const mids = d.metrics.map((m) => m.top + m.height / 2);
      d.target = computeDropIndex(mids, d.index, draggedCenter);

      const offsets = computeOffsets(d.rows.length, d.index, d.target, dragged.height + d.gap);
      d.rows.forEach((row, i) => {
        if (i === d.index) row.style.transform = `translateY(${dy}px)`;
        else row.style.transform = offsets[i] ? `translateY(${offsets[i]}px)` : "";
      });
    }

    // تمرير تلقائي للصفحة عند اقتراب الإصبع من حافة الشاشة (للقوائم الطويلة)
    function autoScrollTick() {
      if (!drag) return;
      const edge = 90;
      const maxSpeed = 16;
      const y = drag.clientY;
      let speed = 0;
      if (y < edge) speed = -maxSpeed * Math.min(1, (edge - y) / edge);
      else if (y > window.innerHeight - edge) speed = maxSpeed * Math.min(1, (y - (window.innerHeight - edge)) / edge);
      if (speed !== 0) {
        window.scrollBy(0, Math.round(speed));
        updateDrag();
      }
      drag.raf = requestAnimationFrame(autoScrollTick);
    }

    function onDragEnd() {
      if (!drag) return;
      const d = drag;
      drag = null;
      suppressRowClickUntil = Date.now() + 500;
      cancelAnimationFrame(d.raf);
      window.removeEventListener("pointermove", onDragMove);
      window.removeEventListener("pointerup", onDragEnd);
      window.removeEventListener("pointercancel", onDragEnd);
      d.rows.forEach((r) => {
        r.style.transform = "";
        r.classList.remove("dragging");
      });
      if (d.target !== d.index) moveItem(d.index, d.target);
    }

    // ---------- الحفظ التلقائي ----------
    // نحفظ بالتسلسل (كل حفظ ينتظر اللي قبله)، وكل حفظ يرسل الترتيب الحالي كاملًا
    let saveChain = Promise.resolve();
    let pendingSaves = 0;

    function showReorderStatus(text, kind) {
      reorderStatusEl.textContent = text;
      reorderStatusEl.className = "reorder-status" + (kind ? " " + kind : "");
      reorderStatusEl.style.display = text ? "block" : "none";
    }

    function queueSave(listId) {
      pendingSaves++;
      showReorderStatus("جارٍ الحفظ...", "");
      saveChain = saveChain.then(async () => {
        try {
          const items = itemsCacheByList[listId];
          if (items) {
            await reorderItems(items.map((i) => i.id));
            items.forEach((it, idx) => {
              it.sort_order = idx;
            });
          }
          pendingSaves--;
          if (pendingSaves === 0) {
            showReorderStatus("تم الحفظ ✓", "success");
            setTimeout(() => {
              if (pendingSaves === 0 && reorderStatusEl.textContent === "تم الحفظ ✓") showReorderStatus("", "");
            }, 2000);
          }
        } catch (e) {
          pendingSaves--;
          const detail = e && e.message ? e.message : "";
          const text = /reorder_items|function/i.test(detail)
            ? "تعذّر حفظ الترتيب — تأكد من تشغيل سكربت SQL الجديد بـ Supabase"
            : "تعذّر حفظ الترتيب: " + detail;
          // نعيد جلب الترتيب الفعلي من الخادم لنعرض الحقيقة بدل ترتيب لم يُحفظ
          delete itemsCacheByList[listId];
          if (listId === activeListId) await showListPanel();
          showReorderStatus(text, "error");
        }
      });
    }

    // -------------------------------------------------
    // تحميل كل القوائم الخاصة بهذا القسم (تُستدعى مرة وحدة عند فتح الصفحة)
    // -------------------------------------------------
    async function loadLists() {
      allLists = await fetchLists(categoryId);
      if (!activeListId && allLists.length > 0) {
        activeListId = allLists[0].id;
      }
      renderTabs();
      await showListPanel();
    }

    // ==================================================================
    // نافذة إضافة/تعديل قائمة
    // ==================================================================
    const listModal = document.getElementById("listModal");
    const listModalTitle = document.getElementById("listModalTitle");
    const listModalError = document.getElementById("listModalError");

    function openAddListModal() {
      editingListId = null;
      listModalTitle.textContent = "إضافة قائمة جديدة";
      document.getElementById("listName").value = "";
      listModalError.textContent = "";
      listModal.style.display = "flex";
    }

    function openEditListModal() {
      const activeList = allLists.find((l) => l.id === activeListId);
      editingListId = activeList.id;
      listModalTitle.textContent = "تعديل القائمة";
      document.getElementById("listName").value = activeList.name;
      listModalError.textContent = "";
      listModal.style.display = "flex";
    }

    document.getElementById("cancelListBtn").addEventListener("click", () => {
      listModal.style.display = "none";
    });

    document.getElementById("saveListBtn").addEventListener("click", async () => {
      const name = document.getElementById("listName").value.trim();
      if (!name) {
        listModalError.textContent = "اكتب اسم القائمة";
        return;
      }
      const saveBtn = document.getElementById("saveListBtn");
      saveBtn.disabled = true; // يمنع تكرار الضغط والتسبب بإضافة القائمة أكثر من مرة
      try {
        if (editingListId) {
          const updated = await updateList(editingListId, { name });
          // نحدّث الصف بالنسخة المحلية مباشرة بدل إعادة جلب كل القوائم من الخادم
          const index = allLists.findIndex((l) => l.id === editingListId);
          if (index !== -1) allLists[index] = updated;
        } else {
          const newList = await addList({ category_id: categoryId, name });
          allLists.push(newList);
          itemsCacheByList[newList.id] = []; // قائمة جديدة تبدأ بدون بنود، لا داعي لجلبها من الخادم
          activeListId = newList.id; // نفتح القائمة الجديدة مباشرة بعد إنشائها
        }
        listModal.style.display = "none";
        renderTabs();
        await showListPanel(); // ما راح يسوي أي اتصال إضافي لو القائمة موجودة بالذاكرة مسبقًا
      } catch (e) {
        listModalError.textContent = e.message || "حدث خطأ أثناء الحفظ";
      } finally {
        saveBtn.disabled = false;
      }
    });

    document.getElementById("editListBtn").addEventListener("click", openEditListModal);

    document.getElementById("deleteListBtn").addEventListener("click", async () => {
      const confirmed = confirm("هل أنت متأكد من حذف هذه القائمة؟ سيتم حذف جميع بنودها وحالاتها معها.");
      if (!confirmed) return;

      // نجلب بنود القائمة (من الذاكرة لو موجودة، أو من الخادم) وننظف صور حالاتها من التخزين
      const items = itemsCacheByList[activeListId] || (await fetchItems(activeListId));
      for (const item of items) {
        await deleteAllCaseImagesForItem(item.id);
      }

      await deleteList(activeListId);
      // نحذف القائمة وبنودها من الذاكرة المحلية مباشرة بدل إعادة الجلب
      allLists = allLists.filter((l) => l.id !== activeListId);
      delete itemsCacheByList[activeListId];
      activeListId = allLists.length > 0 ? allLists[0].id : null;
      renderTabs();
      await showListPanel();
    });

    // ==================================================================
    // نافذة إضافة/تعديل بند
    // ==================================================================
    const itemModal = document.getElementById("itemModal");
    const itemModalTitle = document.getElementById("itemModalTitle");
    const itemModalError = document.getElementById("itemModalError");
    const deleteItemBtn = document.getElementById("deleteItemBtn");

    function openAddItemModal() {
      editingItemId = null;
      itemModalTitle.textContent = "إضافة بند جديد";
      document.getElementById("itemName").value = "";
      document.getElementById("itemSuspended").checked = false;
      itemModalError.textContent = "";
      deleteItemBtn.style.display = "none";
      setupFacilityPicker([]);
      itemModal.style.display = "flex";
    }

    function openEditItemModal(item) {
      editingItemId = item.id;
      itemModalTitle.textContent = "تعديل البند";
      document.getElementById("itemName").value = item.name;
      document.getElementById("itemSuspended").checked = !!item.is_suspended;
      itemModalError.textContent = "";
      deleteItemBtn.style.display = "inline-block";
      setupFacilityPicker((item.item_facility_types || []).map((t) => t.facility_type_id));
      itemModal.style.display = "flex";
    }

    // -------------------------------------------------
    // اختيار المنشأة داخل نافذة البند (يظهر فقط لو للقسم أنواع منشآت)
    // -------------------------------------------------
    function facilityFieldActive() {
      return typesAvailable && allTypes.length > 0;
    }

    function setupFacilityPicker(initialIds) {
      // نتجاهل أي نوع لم يعد موجودًا (محذوف) حتى لا يُرسل للحفظ
      selectedTypeIds = initialIds.filter((id) => typeNameById(id));
      document.getElementById("itemFacilityField").style.display = facilityFieldActive() ? "flex" : "none";
      renderFacilityPicker();
    }

    // قائمة منسدلة فيها الأنواع غير المختارة، والمختارة تظهر كوسوم (× للإزالة)
    // لا شيء مختار = مشترك للكل
    function renderFacilityPicker() {
      const select = document.getElementById("itemFacilitySelect");
      const chips = document.getElementById("itemFacilityChips");

      select.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "تحديد المنشأة";
      select.appendChild(placeholder);
      allTypes
        .filter((t) => !selectedTypeIds.includes(t.id))
        .forEach((t) => {
          const option = document.createElement("option");
          option.value = t.id;
          option.textContent = t.name;
          select.appendChild(option);
        });
      select.value = "";
      select.disabled = allTypes.every((t) => selectedTypeIds.includes(t.id)); // كل الأنواع مختارة

      chips.innerHTML = "";
      if (selectedTypeIds.length === 0) {
        const none = document.createElement("span");
        none.className = "facility-picker-summary";
        none.textContent = "مشترك للكل";
        chips.appendChild(none);
        return;
      }
      selectedTypeIds.forEach((id) => {
        const name = typeNameById(id);
        if (!name) return;
        const chip = document.createElement("span");
        chip.className = "facility-chip";
        const label = document.createElement("span");
        label.textContent = name;
        const remove = document.createElement("button");
        remove.type = "button";
        remove.setAttribute("aria-label", "إزالة");
        remove.textContent = "×";
        remove.addEventListener("click", () => {
          selectedTypeIds = selectedTypeIds.filter((x) => x !== id);
          renderFacilityPicker();
        });
        chip.appendChild(label);
        chip.appendChild(remove);
        chips.appendChild(chip);
      });
    }

    document.getElementById("itemFacilitySelect").addEventListener("change", (e) => {
      const id = e.target.value;
      if (id && !selectedTypeIds.includes(id)) selectedTypeIds.push(id);
      renderFacilityPicker();
    });

    document.getElementById("cancelItemBtn").addEventListener("click", () => {
      itemModal.style.display = "none";
    });

    document.getElementById("saveItemBtn").addEventListener("click", async () => {
      const name = document.getElementById("itemName").value.trim();
      if (!name) {
        itemModalError.textContent = "اكتب اسم البند";
        return;
      }
      const saveBtn = document.getElementById("saveItemBtn");
      saveBtn.disabled = true; // يمنع تكرار الضغط والتسبب بإضافة البند أكثر من مرة
      const is_suspended = document.getElementById("itemSuspended").checked;
      try {
        const items = itemsCacheByList[activeListId];
        let saved;
        if (editingItemId) {
          const index = items.findIndex((i) => i.id === editingItemId);
          const previous = index !== -1 ? items[index] : null;
          saved = await updateItem(editingItemId, { name, is_suspended });
          // الرد ما يحتوي الأنواع، فنحتفظ بالقديمة (تتحدّث تحت لو المشرف حدّدها)
          saved.item_facility_types = previous ? previous.item_facility_types || [] : [];
          if (index !== -1) items[index] = saved;
        } else {
          // البند الجديد دائمًا آخر القائمة (حتى بعد الترتيب اليدوي)
          const nextOrder = items.length > 0 ? Math.max(...items.map((i) => Number(i.sort_order) || 0)) + 1 : 0;
          saved = await addItem({ list_id: activeListId, name, is_suspended, sort_order: nextOrder });
          saved.item_facility_types = [];
          items.push(saved);
        }

        // حفظ أنواع المنشآت (فقط لو حقل الاختيار ظاهر)
        if (facilityFieldActive()) {
          try {
            await setItemFacilityTypes(saved.id, selectedTypeIds);
            saved.item_facility_types = selectedTypeIds.map((id) => ({ facility_type_id: id }));
          } catch (tagError) {
            // البند انحفظ لكن الأنواع لا — نبقي النافذة مفتوحة بوضع التعديل عشان إعادة المحاولة ما تكرر البند
            editingItemId = saved.id;
            itemModalTitle.textContent = "تعديل البند";
            deleteItemBtn.style.display = "inline-block";
            itemModalError.textContent = "تم حفظ البند، لكن تعذّر حفظ المنشأة: " + (tagError.message || "");
            renderListPanel();
            return;
          }
        }

        itemModal.style.display = "none";
        renderListPanel(); // رسم فوري من الذاكرة، بدون اتصال إضافي بالخادم
      } catch (e) {
        itemModalError.textContent = e.message || "حدث خطأ أثناء الحفظ";
      } finally {
        saveBtn.disabled = false;
      }
    });

    deleteItemBtn.addEventListener("click", async () => {
      // حماية إضافية: لازم يكتب كلمة "حذف" بالضبط عشان يتأكد الحذف (مو بس ضغطة تأكيد عادية)
      const typed = prompt('حذف البند يمسح كل حالاته وصوره نهائيًا ولا يمكن التراجع.\nللتأكيد، اكتب كلمة "حذف" بالضبط:');
      if (typed !== "حذف") return;

      await deleteAllCaseImagesForItem(editingItemId); // تنظيف صور حالات البند من التخزين قبل حذفه
      await deleteItem(editingItemId);
      itemsCacheByList[activeListId] = itemsCacheByList[activeListId].filter((i) => i.id !== editingItemId);
      itemModal.style.display = "none";
      renderListPanel();
    });

    // ==================================================================
    // إدارة أنواع المنشآت (إضافة / تعديل / حذف)
    // ==================================================================
    const typesModal = document.getElementById("typesModal");
    const typesModalError = document.getElementById("typesModalError");

    function renderTypesList() {
      const box = document.getElementById("typesList");
      box.innerHTML = "";
      if (allTypes.length === 0) {
        box.innerHTML = '<div class="empty-hint">لا توجد أنواع منشآت بعد.</div>';
        return;
      }
      allTypes.forEach((t) => {
        const row = document.createElement("div");
        row.className = "type-row";

        const name = document.createElement("span");
        name.className = "type-name";
        name.textContent = t.name;

        const actions = document.createElement("div");
        actions.className = "type-actions";

        const editBtn = document.createElement("button");
        editBtn.className = "secondary";
        editBtn.textContent = "تعديل";
        editBtn.addEventListener("click", () => renameType(t));

        const delBtn = document.createElement("button");
        delBtn.className = "danger";
        delBtn.textContent = "حذف";
        delBtn.addEventListener("click", () => deleteTypeFlow(t));

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        row.appendChild(name);
        row.appendChild(actions);
        box.appendChild(row);
      });
    }

    async function renameType(type) {
      typesModalError.textContent = "";
      const input = prompt("اسم نوع المنشأة:", type.name);
      if (input === null) return;
      const newName = input.trim();
      if (!newName || newName === type.name) return;
      try {
        const updated = await updateFacilityType(type.id, { name: newName });
        const index = allTypes.findIndex((x) => x.id === type.id);
        if (index !== -1) allTypes[index] = updated;
        renderTypesList();
        renderListPanel(); // تحديث أسماء الوسوم بالبنود
      } catch (e) {
        typesModalError.textContent = e.message || "تعذر تعديل الاسم";
      }
    }

    // -------------------------------------------------
    // حذف نوع منشأة:
    // - البنود المشتركة مع أنواع أخرى: تُزال علاقتها بهذا النوع فقط وتبقى
    // - البنود المرتبطة بهذا النوع وحده: تُحذف معه (بحالاتها وصورها)
    // مع رسالة توضح العدد، وتأكيد بكتابة كلمة "حذف"
    // -------------------------------------------------
    async function deleteTypeFlow(type) {
      typesModalError.textContent = "";
      try {
        const items = await fetchItemsForLists(allLists.map((l) => l.id));
        const tagsOf = (i) => (i.item_facility_types || []).map((t) => t.facility_type_id);
        const exclusive = items.filter((i) => {
          const tags = tagsOf(i);
          return tags.length === 1 && tags[0] === type.id;
        });
        const shared = items.filter((i) => {
          const tags = tagsOf(i);
          return tags.includes(type.id) && tags.length > 1;
        });
        const casesCount = await countCasesForItems(exclusive.map((i) => i.id));

        let message = `سيتم حذف نوع المنشأة "${type.name}" نهائيًا.`;
        if (exclusive.length > 0) {
          message += `\nسيتم حذف ${exclusive.length} بند مرتبط به وحده، وفيها ${casesCount} حالة بصورها.`;
        }
        if (shared.length > 0) {
          message += `\nسيبقى ${shared.length} بند مشترك مع أنواع أخرى، وتُزال علاقته بهذا النوع فقط.`;
        }
        if (exclusive.length === 0 && shared.length === 0) {
          message += "\nلا توجد بنود مرتبطة به.";
        }
        const typed = prompt(message + '\nللتأكيد، اكتب كلمة "حذف" بالضبط:');
        if (typed !== "حذف") return;

        // نحذف البنود المنفردة أولًا (مع تنظيف صور حالاتها من التخزين)، ثم النوع نفسه
        // هذا الترتيب مقصود: لو فشل حذف النوع، ما تتحول بنود منفردة إلى مشتركة بالخطأ
        for (const item of exclusive) {
          await deleteAllCaseImagesForItem(item.id);
        }
        await deleteItemsByIds(exclusive.map((i) => i.id));
        await deleteFacilityType(type.id);

        allTypes = allTypes.filter((t) => t.id !== type.id);
        itemsCacheByList = {}; // بنود انحذفت وعلاقات تغيّرت، فنعيد الجلب عند الحاجة
        renderTypesList();
        await showListPanel();
      } catch (e) {
        typesModalError.textContent = e.message || "تعذر حذف النوع";
      }
    }

    document.getElementById("manageTypesBtn").addEventListener("click", () => {
      typesModalError.textContent = "";
      document.getElementById("newTypeName").value = "";
      renderTypesList();
      typesModal.style.display = "flex";
    });

    document.getElementById("closeTypesBtn").addEventListener("click", () => {
      typesModal.style.display = "none";
    });

    document.getElementById("addTypeBtn").addEventListener("click", async () => {
      const name = document.getElementById("newTypeName").value.trim();
      if (!name) {
        typesModalError.textContent = "اكتب اسم نوع المنشأة";
        return;
      }
      const btn = document.getElementById("addTypeBtn");
      btn.disabled = true; // يمنع تكرار الضغط
      typesModalError.textContent = "";
      try {
        const created = await addFacilityType({ category_id: categoryId, name });
        allTypes.push(created);
        document.getElementById("newTypeName").value = "";
        renderTypesList();
      } catch (e) {
        typesModalError.textContent = e.message || "تعذر إضافة النوع";
      } finally {
        btn.disabled = false;
      }
    });

    // مفتاح "عرض جميع البنود للمفتش دون تصفية" (لكل قسم)
    document.getElementById("showAllToggle").addEventListener("change", async (e) => {
      const toggle = e.target;
      const wanted = toggle.checked;
      toggle.disabled = true;
      try {
        await updateCategoryShowAll(categoryId, wanted);
      } catch (err) {
        toggle.checked = !wanted; // نرجّعه لحالته السابقة لو فشل الحفظ
        alert("تعذر حفظ الإعداد: " + (err.message || ""));
      } finally {
        toggle.disabled = false;
      }
    });

    // ==================================================================
    // تشغيل الصفحة: التحقق من صلاحية المشرف، ثم تحميل اسم القسم والقوائم
    // ==================================================================
    (async () => {
      await requireAuth({ adminOnly: true });

      if (!categoryId) {
        document.getElementById("categoryBreadcrumb").textContent = "لم يتم تحديد قسم";
        return;
      }

      const category = await fetchCategoryById(categoryId);
      document.getElementById("categoryBreadcrumb").textContent = "الأقسام";
      document.getElementById("categoryTitle").textContent = category.name;

      // أنواع المنشآت وإعداد العرض: لو الجدول غير جاهز بعد (لم يُشغَّل سكربت SQL) نخفي أدواتها
      try {
        allTypes = await fetchFacilityTypes(categoryId);
        typesAvailable = true;
        document.getElementById("showAllToggle").checked = category.show_all_items !== false;
        document.getElementById("categoryTools").style.display = "flex";
      } catch (e) {
        typesAvailable = false;
        allTypes = [];
      }

      document.getElementById("backAdminBtn").addEventListener("click", () => {
        window.history.back();
      });

      await loadLists();
    })();
  </script>
</body>
</html>
