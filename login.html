<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" />
  <meta name="apple-mobile-web-app-title" content="مساعد المفتش" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <title>تسجيل الدخول — مساعد المفتش</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <!-- مكتبة Supabase الرسمية (من CDN) — لازم تكون قبل config.js -->
  <link rel="preconnect" href="https://twbatrsenepuaylyiqsq.supabase.co" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ==================== الشعار ====================
       mix-blend-mode: multiply يخلي خلفية الصورة البيضاء تندمج مع خلفية
       الصفحة تلقائيًا بدون ما نحتاج نعدّل الصورة نفسها أو نشيل خلفيتها يدويًا ===================== -->
  <div class="login-logo">
    <img src="logo.png" alt="الامتثال البلدي" />
  </div>

  <!-- ==================== صندوق النموذج (تسجيل دخول / حساب جديد) ==================== -->
  <div class="container">
    <div class="card">
      <!-- العنوان يتغيّر تلقائيًا بين "تسجيل الدخول" و "إنشاء حساب جديد" -->
      <h2 id="formTitle">تسجيل الدخول</h2>

      <!-- يظهر فقط بوضع "إنشاء حساب جديد" -->
      <div class="field" id="fullNameField" style="display:none">
        <label for="fullName">الاسم الثلاثي</label>
        <input type="text" id="fullName" />
      </div>

      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" />
      </div>
      <div class="field" id="passwordField">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" />
      </div>

      <!-- تظهر فيها رسالة الخطأ لو صار خطأ بالتسجيل/الدخول -->
      <div class="error" id="errorMsg"></div>
      <!-- تظهر فيها رسالة نجاح (مثلاً بعد إنشاء حساب جديد) -->
      <div class="success" id="successMsg"></div>

      <!-- نفس الزر يستخدم لتسجيل الدخول أو إنشاء الحساب حسب الوضع الحالي -->
      <button id="submitBtn" style="width:100%">دخول</button>

      <div class="center" style="margin-top:14px">
        <!-- زر يبدّل بين وضع "تسجيل دخول" ووضع "إنشاء حساب جديد" -->
        <button class="link-btn" id="toggleModeBtn">ليس لديك حساب؟ أنشئ حسابًا جديدًا</button>
      </div>
      <div class="center" style="margin-top:10px">
        <button class="link-btn" id="forgotBtn">نسيت كلمة المرور؟</button>
      </div>
    </div>
  </div>

  <!-- ترتيب التحميل مهم: config.js (فيه supabaseClient) ثم auth.js (يستخدمه) -->
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    // ==================================================================
    // منطق الصفحة: يبدّل بين وضعين (login / signup) بنفس النموذج
    // ==================================================================

    let mode = "login"; // القيمة الحالية: "login" أو "signup"

    const formTitle = document.getElementById("formTitle");
    const submitBtn = document.getElementById("submitBtn");
    const toggleModeBtn = document.getElementById("toggleModeBtn");
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");
    const forgotBtn = document.getElementById("forgotBtn");
    const passwordField = document.getElementById("passwordField");

    // يضبط الواجهة حسب الوضع: login / signup / forgot
    function applyMode() {
      const titles = { login: "تسجيل الدخول", signup: "إنشاء حساب جديد", forgot: "استعادة كلمة المرور" };
      const submits = { login: "دخول", signup: "إنشاء الحساب", forgot: "إرسال رابط الاستعادة" };
      const toggles = {
        login: "ليس لديك حساب؟ أنشئ حسابًا جديدًا",
        signup: "لديك حساب بالفعل؟ سجّل الدخول",
        forgot: "العودة إلى تسجيل الدخول",
      };
      formTitle.textContent = titles[mode];
      submitBtn.textContent = submits[mode];
      toggleModeBtn.textContent = toggles[mode];
      document.getElementById("fullNameField").style.display = mode === "signup" ? "flex" : "none";
      passwordField.style.display = mode === "forgot" ? "none" : "flex";
      forgotBtn.style.display = mode === "login" ? "inline" : "none";
      errorMsg.textContent = "";
      successMsg.textContent = "";
    }

    forgotBtn.addEventListener("click", () => {
      mode = "forgot";
      applyMode();
    });

    // -------- الضغط على "ليس لديك حساب؟" يبدّل نصوص الواجهة بين الوضعين --------
    toggleModeBtn.addEventListener("click", () => {
      mode = mode === "login" ? "signup" : "login";
      applyMode();
    });

    // -------- الضغط على زر "دخول" / "إنشاء الحساب" --------
    submitBtn.addEventListener("click", async () => {
      errorMsg.textContent = "";
      successMsg.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const fullName = document.getElementById("fullName").value.trim();

      // وضع استعادة كلمة المرور: رسالة موحدة دائمًا (لا نكشف هل البريد مسجل أم لا)
      if (mode === "forgot") {
        if (!email) {
          errorMsg.textContent = "اكتب بريدك الإلكتروني";
          return;
        }
        submitBtn.disabled = true;
        try {
          await requestPasswordReset(email);
        } catch (e) {
          // نتجاهل الخطأ عمدًا ليبقى الرد واحدًا سواء وُجد البريد أم لا
        }
        successMsg.textContent = "إن كان البريد مسجّلًا لدينا فستصلك رسالة تحتوي على رابط لاستعادة كلمة المرور.";
        submitBtn.disabled = false;
        return;
      }

      // تحقق بسيط: الحقول ما تكون فاضية
      if (!email || !password) {
        errorMsg.textContent = "عبّي البريد وكلمة المرور";
        return;
      }
      if (mode === "signup" && !fullName) {
        errorMsg.textContent = "اكتب اسمك الثلاثي";
        return;
      }

      submitBtn.disabled = true; // يمنع الضغط المتكرر أثناء الإرسال
      try {
        if (mode === "login") {
          // تسجيل دخول (الدالة login موجودة بملف auth.js)
          await login(email, password);
          window.location.href = "index.html";
        } else {
          // إنشاء حساب جديد (الدالة signup موجودة بملف auth.js)
          await signup(email, password, fullName);
          successMsg.textContent = "تم إنشاء الحساب. تحقق من بريدك لتأكيد التسجيل إذا طُلب منك ذلك، ثم سجّل الدخول.";
          // بعد نجاح الإنشاء، نرجّع النموذج لوضع "تسجيل دخول"
          mode = "login";
          applyMode();
          successMsg.textContent = "تم إنشاء الحساب. تحقق من بريدك لتأكيد التسجيل إذا طُلب منك ذلك، ثم سجّل الدخول.";
          document.getElementById("fullName").value = "";
        }
      } catch (e) {
        // أي خطأ من Supabase (بريد مستخدم من قبل، كلمة مرور قصيرة...) يظهر هنا
        errorMsg.textContent = e.message || "حدث خطأ، حاول مرة أخرى";
      } finally {
        submitBtn.disabled = false;
      }
    });

    // -------- لو المستخدم مسجل دخول مسبقًا، وديه مباشرة للصفحة الرئيسية --------
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = "index.html";
    })();
  </script>
</body>
</html>
