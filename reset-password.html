<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" />
  <meta name="apple-mobile-web-app-title" content="مساعد المفتش" />
  <link rel="manifest" href="manifest.json" />
  <title>تعيين كلمة مرور جديدة — مساعد المفتش</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-logo">
    <img src="logo.png" alt="الامتثال البلدي" />
  </div>

  <div class="container">
    <div class="card">
      <h2>تعيين كلمة مرور جديدة</h2>

      <!-- رسالة تظهر حين يكون الرابط غير صالح أو منتهيًا -->
      <div class="error" id="invalidMsg" style="display:none">
        الرابط غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا من صفحة تسجيل الدخول.
      </div>

      <div id="formArea" style="display:none">
        <div class="field">
          <label for="newPassword">كلمة المرور الجديدة</label>
          <input type="password" id="newPassword" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="confirmPassword">تأكيد كلمة المرور</label>
          <input type="password" id="confirmPassword" autocomplete="new-password" />
        </div>
        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>
        <button id="saveBtn" style="width:100%">حفظ كلمة المرور</button>
      </div>

      <div class="center" style="margin-top:14px">
        <a class="link-btn" href="login.html">العودة إلى تسجيل الدخول</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    const MIN_LEN = 6;
    const formArea = document.getElementById("formArea");
    const invalidMsg = document.getElementById("invalidMsg");
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");
    const saveBtn = document.getElementById("saveBtn");
    let ready = false;

    function showForm() {
      ready = true;
      invalidMsg.style.display = "none";
      formArea.style.display = "block";
    }

    // الرابط القادم من البريد ينشئ جلسة استعادة؛ نلتقطها بالحدث أو بالجلسة الحالية
    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") showForm();
    });

    (async () => {
      // نمنح المكتبة لحظة لمعالجة الرمز الموجود في الرابط
      await new Promise((r) => setTimeout(r, 800));
      if (ready) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) showForm();
      else invalidMsg.style.display = "block";
    })();

    saveBtn.addEventListener("click", async () => {
      errorMsg.textContent = "";
      successMsg.textContent = "";
      const p1 = document.getElementById("newPassword").value;
      const p2 = document.getElementById("confirmPassword").value;

      if (p1.length < MIN_LEN) {
        errorMsg.textContent = "يجب ألا تقل كلمة المرور عن 6 أحرف";
        return;
      }
      if (p1 !== p2) {
        errorMsg.textContent = "كلمتا المرور غير متطابقتين";
        return;
      }

      saveBtn.disabled = true;
      try {
        await updateMyPassword(p1);
        successMsg.textContent = "تم تغيير كلمة المرور بنجاح. سيتم تحويلك إلى تسجيل الدخول.";
        sessionStorage.removeItem("inspector_profile_cache");
        await supabaseClient.auth.signOut();
        setTimeout(() => { window.location.href = "login.html"; }, 2000);
      } catch (e) {
        const m = (e && e.message) || "";
        if (/same|different/i.test(m)) errorMsg.textContent = "يجب أن تختلف كلمة المرور الجديدة عن القديمة";
        else if (/at least|weak|short/i.test(m)) errorMsg.textContent = "كلمة المرور ضعيفة أو قصيرة";
        else errorMsg.textContent = "تعذّر حفظ كلمة المرور، اطلب رابطًا جديدًا وحاول مرة أخرى";
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
