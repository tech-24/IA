<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة الأدوات المساعدة — مساعد المفتش</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>إدارة الأدوات المساعدة</h1>
    <div class="user-info">
      <button id="backAdminBtn" class="secondary">الرئيسية</button>
    </div>
  </header>

  <div class="main">
    <div class="categories-grid" id="toolsGrid"></div>
  </div>

  <!-- ==================== نافذة إضافة/تعديل أداة ==================== -->
  <div class="modal-overlay" id="toolModal" style="display:none">
    <div class="modal-box">
      <h3 id="toolModalTitle">إضافة أداة جديدة</h3>

      <div class="field">
        <label for="toolName">اسم الأداة</label>
        <input type="text" id="toolName" />
      </div>

      <div class="field">
        <label>نوع الرابط</label>
        <div class="image-type-toggle">
          <button type="button" id="linkTypeBtn" class="active">رابط خارجي</button>
          <button type="button" id="fileTypeBtn">رفع ملف</button>
        </div>
      </div>

      <div class="field" id="toolUrlField">
        <label for="toolUrl">الرابط</label>
        <input type="url" id="toolUrl" placeholder="https://" />
      </div>

      <div class="field" id="toolFileField" style="display:none">
        <label for="toolUrlFile">اختر ملف (PDF أو أي مستند)</label>
        <input type="file" id="toolUrlFile" />
      </div>

      <div class="field">
        <label for="toolFile">إرفاق أيقونة (اختياري)</label>
        <input type="file" id="toolFile" accept="image/*" />
      </div>

      <div class="error" id="toolModalError"></div>

      <div class="modal-actions">
        <button id="saveToolBtn">حفظ</button>
        <button class="secondary" id="cancelToolBtn">إلغاء</button>
      </div>

      <div class="center" style="margin-top:10px">
        <button class="link-btn" id="deleteToolBtn" style="display:none;color:#b91c1c">حذف هذي الأداة</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="image-utils.js"></script>
  <script src="tools.js"></script>
  <script>
    let allTools = [];
    let editingToolId = null;

    const toolsGrid = document.getElementById("toolsGrid");

    function renderTools() {
      toolsGrid.innerHTML = "";

      allTools.forEach((tool) => {
        const card = document.createElement("div");
        card.className = "category-card";
        card.dataset.id = tool.id;
        card.style.cursor = "pointer";
        card.addEventListener("click", () => openEditToolModal(tool));

        const handle = document.createElement("div");
        handle.className = "drag-handle";
        handle.textContent = "⠿";
        handle.addEventListener("click", (e) => e.stopPropagation());
        attachDragHandle(handle, card, allTools, persistToolOrder);
        card.appendChild(handle);

        const visual = document.createElement("div");
        visual.className = "category-visual";
        visual.innerHTML = tool.image_value
          ? `<img src="${tool.image_value}" alt="${tool.name}" style="object-fit:contain;padding:10px;box-sizing:border-box" />`
          : `<span class="icon-text">🔗</span>`;

        const name = document.createElement("div");
        name.className = "category-name";
        name.textContent = tool.name;

        card.appendChild(visual);
        card.appendChild(name);
        toolsGrid.appendChild(card);
      });

      const addCard = document.createElement("div");
      addCard.className = "add-category-card";
      addCard.textContent = "+ إضافة أداة جديدة";
      addCard.addEventListener("click", openAddToolModal);
      toolsGrid.appendChild(addCard);
    }

    // ==================================================================
    // السحب والإفلات لإعادة الترتيب (يشتغل باللمس والماوس عبر Pointer Events)
    // نفس الآلية المستخدمة بصفحة الأقسام
    // ==================================================================
    function attachDragHandle(handleEl, cardEl, arrayRef, persistFn) {
      handleEl.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const pointerId = e.pointerId;
        handleEl.setPointerCapture(pointerId);
        cardEl.classList.add("dragging-card");

        function onMove(ev) {
          const x = ev.clientX, y = ev.clientY;
          const grid = cardEl.parentElement;
          const siblings = Array.from(grid.children).filter(
            (el) => el !== cardEl && el.classList.contains("category-card")
          );
          let closest = null;
          let closestDist = Infinity;
          siblings.forEach((sib) => {
            const r = sib.getBoundingClientRect();
            const dist = Math.hypot(r.left + r.width / 2 - x, r.top + r.height / 2 - y);
            if (dist < closestDist) { closestDist = dist; closest = sib; }
          });
          if (closest) {
            const children = Array.from(grid.children);
            const cardIndex = children.indexOf(cardEl);
            const closestIndex = children.indexOf(closest);
            if (cardIndex > closestIndex) grid.insertBefore(cardEl, closest);
            else grid.insertBefore(cardEl, closest.nextSibling);
          }
        }

        function onUp() {
          handleEl.releasePointerCapture(pointerId);
          handleEl.removeEventListener("pointermove", onMove);
          handleEl.removeEventListener("pointerup", onUp);
          cardEl.classList.remove("dragging-card");

          const grid = cardEl.parentElement;
          const newOrderIds = Array.from(grid.children)
            .filter((el) => el.classList.contains("category-card"))
            .map((el) => el.dataset.id);
          arrayRef.sort((a, b) => newOrderIds.indexOf(a.id) - newOrderIds.indexOf(b.id));
          arrayRef.forEach((item, idx) => { item.sort_order = idx; });
          persistFn(arrayRef);
        }

        handleEl.addEventListener("pointermove", onMove);
        handleEl.addEventListener("pointerup", onUp);
      });
    }

    // -------------------------------------------------
    // تحفظ الترتيب الجديد للأدوات بقاعدة البيانات بعد انتهاء السحب
    // -------------------------------------------------
    async function persistToolOrder(items) {
      for (const item of items) {
        try {
          await updateToolSortOrder(item.id, item.sort_order);
        } catch (e) {
          // نتجاهل فشل عنصر واحد بصمت، الباقي يستمر يحفظ
        }
      }
    }

    async function loadTools() {
      allTools = await fetchTools();
      renderTools();
    }

    // ==================================================================
    // نافذة إضافة/تعديل أداة
    // ==================================================================
    const toolModal = document.getElementById("toolModal");
    const toolModalTitle = document.getElementById("toolModalTitle");
    const toolModalError = document.getElementById("toolModalError");
    const deleteToolBtn = document.getElementById("deleteToolBtn");
    const linkTypeBtn = document.getElementById("linkTypeBtn");
    const fileTypeBtn = document.getElementById("fileTypeBtn");
    const toolUrlField = document.getElementById("toolUrlField");
    const toolFileField = document.getElementById("toolFileField");
    let currentUrlType = "link"; // "link" أو "file" — أي وضع مفعّل حاليًا بالنافذة

    function setUrlType(type) {
      currentUrlType = type;
      linkTypeBtn.classList.toggle("active", type === "link");
      fileTypeBtn.classList.toggle("active", type === "file");
      toolUrlField.style.display = type === "link" ? "block" : "none";
      toolFileField.style.display = type === "file" ? "block" : "none";
    }
    linkTypeBtn.addEventListener("click", () => setUrlType("link"));
    fileTypeBtn.addEventListener("click", () => setUrlType("file"));

    function openAddToolModal() {
      editingToolId = null;
      toolModalTitle.textContent = "إضافة أداة جديدة";
      document.getElementById("toolName").value = "";
      document.getElementById("toolUrl").value = "";
      document.getElementById("toolUrlFile").value = "";
      document.getElementById("toolFile").value = "";
      toolModalError.textContent = "";
      deleteToolBtn.style.display = "none";
      setUrlType("link");
      toolModal.style.display = "flex";
    }

    function openEditToolModal(tool) {
      editingToolId = tool.id;
      toolModalTitle.textContent = "تعديل الأداة";
      document.getElementById("toolName").value = tool.name;
      document.getElementById("toolUrl").value = tool.url;
      document.getElementById("toolUrlFile").value = "";
      document.getElementById("toolFile").value = "";
      toolModalError.textContent = "";
      deleteToolBtn.style.display = "inline-block";
      setUrlType("link"); // نعرض الرابط الحالي دائمًا بوضع "رابط"، ولو رفع ملف جديد يستبدله
      toolModal.style.display = "flex";
    }

    document.getElementById("cancelToolBtn").addEventListener("click", () => {
      toolModal.style.display = "none";
    });

    document.getElementById("saveToolBtn").addEventListener("click", async () => {
      const name = document.getElementById("toolName").value.trim();
      const url = document.getElementById("toolUrl").value.trim();
      const urlFile = document.getElementById("toolUrlFile").files[0];
      const file = document.getElementById("toolFile").files[0];

      const hasLink = currentUrlType === "link" && url;
      const hasFile = currentUrlType === "file" && urlFile;

      if (!name || (!hasLink && !hasFile && !editingToolId)) {
        toolModalError.textContent = "اكتب اسم الأداة، واختر رابط أو ملف";
        return;
      }

      const saveBtn = document.getElementById("saveToolBtn");
      saveBtn.disabled = true;
      try {
        if (editingToolId) {
          const oldTool = allTools.find((t) => t.id === editingToolId);
          const updated = await updateTool(editingToolId, {
            name,
            url: hasLink ? url : null,
            urlFile: hasFile ? urlFile : null,
            file,
          });
          // لو رفع أيقونة أو ملف جديد يستبدل القديم، نحذف القديم فعليًا من التخزين
          if (file && oldTool.image_value) await deleteToolStorageFile(oldTool.image_value, TOOL_BUCKET);
          // نحذف ملف الرابط القديم فعليًا لو كان محفوظ عندنا بالتخزين، سواء استُبدل بملف جديد أو برابط خارجي
          const oldUrlWasStoredFile = oldTool.url && oldTool.url.includes(SUPABASE_URL);
          if ((hasFile || hasLink) && oldUrlWasStoredFile) {
            await deleteToolStorageFile(oldTool.url, TOOL_FILE_BUCKET);
          }
          const index = allTools.findIndex((t) => t.id === editingToolId);
          if (index !== -1) allTools[index] = updated;
        } else {
          const created = await addTool({
            name,
            url: hasLink ? url : null,
            urlFile: hasFile ? urlFile : null,
            file,
          });
          allTools.push(created);
        }
        toolModal.style.display = "none";
        renderTools();
      } catch (e) {
        toolModalError.textContent = e.message || "حدث خطأ أثناء الحفظ";
      } finally {
        saveBtn.disabled = false;
      }
    });

    deleteToolBtn.addEventListener("click", async () => {
      const confirmed = confirm("هل أنت متأكد من حذف هذي الأداة؟");
      if (!confirmed) return;
      const tool = allTools.find((t) => t.id === editingToolId);
      await deleteTool(editingToolId);
      // نحذف الأيقونة وملف الأداة (لو موجودين) فعليًا من التخزين
      if (tool) {
        if (tool.image_value) await deleteToolStorageFile(tool.image_value, TOOL_BUCKET);
        if (tool.url) await deleteToolStorageFile(tool.url, TOOL_FILE_BUCKET);
      }
      allTools = allTools.filter((t) => t.id !== editingToolId);
      toolModal.style.display = "none";
      renderTools();
    });

    // ==================================================================
    // تشغيل الصفحة
    // ==================================================================
    (async () => {
      await requireAuth({ adminOnly: true });
      document.getElementById("backAdminBtn").addEventListener("click", () => {
        window.location.href = "admin.html";
      });
      await loadTools();
    })();
  </script>
</body>
</html>
