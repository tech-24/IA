<script>
  document.getElementById("hamburgerBtn").addEventListener("click", () => {
    document.getElementById("drawerOverlay").style.display = "block";
    document.getElementById("sideDrawer").classList.add("open");
  });
  function closeSideDrawer() {
    document.getElementById("drawerOverlay").style.display = "none";
    document.getElementById("sideDrawer").classList.remove("open");
  }
  document.getElementById("closeDrawerBtn").addEventListener("click", closeSideDrawer);
  document.getElementById("drawerOverlay").addEventListener("click", closeSideDrawer);
  document.getElementById("syncBtn").addEventListener("click", () => location.reload());
  document.getElementById("drawerLogoutBtn").addEventListener("click", logout);
</script>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="tools.js"></script>
  <script src="circulars.js"></script>
  <script src="bottom-nav.js"></script>
  <script>
    // -------------------------------------------------
    // عرض الأدوات: أيقونة واسم فقط، الرابط نفسه مو ظاهر بالواجهة
    // الضغط على الأداة يفتح رابطها بتبويب جديد
    // -------------------------------------------------
    function renderTools(tools) {
      const grid = document.getElementById("toolsGrid");
      grid.innerHTML = "";

      if (tools.length === 0) {
        grid.innerHTML = '<div class="empty-hint">لا توجد أدوات مساعدة حاليًا.</div>';
        return;
      }

      tools.forEach((tool) => {
        const card = document.createElement("div");
        card.className = "tool-card";
        card.innerHTML = `
          <div class="tool-visual">
            ${tool.image_value ? `<img src="${escapeHtml(tool.image_value)}" alt="${escapeHtml(tool.name)}" />` : `<span class="icon-text">🔗</span>`}
          </div>
          <div class="tool-name">${escapeHtml(tool.name)}</div>
        `;
        card.addEventListener("click", () => {
          window.open(tool.url, "_blank", "noopener,noreferrer");
        });
        grid.appendChild(card);
      });
    }

    (async () => {
      await requireAuth(); // أي مستخدم مسجل دخول (زائر أو مشرف)
      const tools = await fetchTools();
      renderTools(tools);
      updateCircularsNavDot();
    })();
  </script>
