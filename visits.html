  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const toolId = urlParams.get("tool_id");

    document.getElementById("backBtn").addEventListener("click", () => window.history.back());

    let myProfile = null;
    let statuses = [];
    let areas = [];
    let allVisits = [];
    let editingVisitId = null;
    let editingVisitInspectorId = null; // المفتش الأصلي صاحب الزيارة الجاري تعديلها (لمسار الصور الصحيح)
    let editingOldEstPath = null; // المسار القديم لصورة المنشأة قبل التعديل (لتنظيفه لو تغيّر)
    let editingOldLicPath = null;
    let manualLocationUrl = null;
    let capturedLat = null;
    let capturedLng = null;

    const STATUS_COLORS = ["#16a34a", "#b91c1c", "#d97706", "#64748b", "#7c3aed", "#0891b2"];
    function statusColor(statusId) {
      const index = statuses.findIndex((s) => s.id === statusId);
      return STATUS_COLORS[index >= 0 ? index % STATUS_COLORS.length : 0];
    }

    // ملاحظة: النموذج هنا للتعديل فقط (لا تسجيل زيارة جديدة بلوحة المشرف)،
    // فما نحتاج دالة تحديد موقع تلقائي — الموقع المعروض دائمًا هو موقع الزيارة الأصلي المسجَّل

    // -------------------------------------------------
    // تعديل الموقع يدويًا (لصق رابط) — له الأولوية على الإحداثيات المسجّلة إذا كان مفعّلًا
    // -------------------------------------------------
    function updateLocationUI() {
      const hint = document.getElementById("locationHint");
      const resetBtn = document.getElementById("resetLocationBtn");
      if (manualLocationUrl) {
        hint.textContent = "موقع يدوي ✓";
        resetBtn.style.display = "inline";
      } else {
        hint.textContent = capturedLat ? "✓ الموقع المسجّل محفوظ" : "بدون موقع مسجّل";
        resetBtn.style.display = "none";
      }
    }

    document.getElementById("editLocationBtn").addEventListener("click", () => {
      document.getElementById("manualLocationInput").value = manualLocationUrl || "";
      document.getElementById("manualLocationError").textContent = "";
      document.getElementById("manualLocationField").style.display = "flex";
    });
    document.getElementById("cancelManualLocationBtn").addEventListener("click", () => {
      document.getElementById("manualLocationField").style.display = "none";
    });
    document.getElementById("saveManualLocationBtn").addEventListener("click", () => {
      const url = document.getElementById("manualLocationInput").value.trim();
      const errorEl = document.getElementById("manualLocationError");
      if (!url.startsWith("https://") || !(url.includes("maps") || url.includes("goo.gl"))) {
        errorEl.textContent = "الرابط غير صحيح";
        return;
      }
      manualLocationUrl = url;
      document.getElementById("manualLocationField").style.display = "none";
      updateLocationUI();
    });
    document.getElementById("resetLocationBtn").addEventListener("click", () => {
      manualLocationUrl = null;
      document.getElementById("manualLocationField").style.display = "none";
      updateLocationUI();
    });

    // -------------------------------------------------
    // اختيار صورة: تصوير (كاميرا) أو من الجهاز (معرض الصور) — نفس الحقل، زرّان مختلفان
    // -------------------------------------------------
    function setupPhotoBox(boxId, inputId) {
      const box = document.getElementById(boxId);
      const input = document.getElementById(inputId);
      let file = null;
      let existingUrl = null;
      let hadExisting = false;
      let clearedExisting = false;

      function render() {
        box.innerHTML = "";
        const url = file ? URL.createObjectURL(file) : existingUrl;
        if (url) {
          const img = document.createElement("img");
          img.src = url;
          box.appendChild(img);
          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.className = "visit-photo-remove";
          removeBtn.setAttribute("aria-label", "حذف الصورة");
          removeBtn.textContent = "×";
          removeBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (hadExisting && !file) clearedExisting = true;
            file = null;
            existingUrl = null;
            input.value = "";
            render();
          });
          box.appendChild(removeBtn);
        } else {
          box.innerHTML = '<span class="visit-photo-placeholder">+</span>';
        }
      }

      box.addEventListener("click", () => input.click());
      input.addEventListener("change", () => {
        if (input.files[0]) {
          file = input.files[0];
          clearedExisting = false;
          render();
        }
      });

      return {
        showExisting(url) {
          existingUrl = url;
          hadExisting = !!url;
          clearedExisting = false;
          file = null;
          input.value = "";
          render();
        },
        reset() {
          file = null;
          existingUrl = null;
          hadExisting = false;
          clearedExisting = false;
          input.value = "";
          render();
        },
        getFile: () => file,
        wasCleared: () => clearedExisting,
      };
    }
    const estPhotoBox = setupPhotoBox("visitEstPhotoBox", "visitEstPhoto");
    const licPhotoBox = setupPhotoBox("visitLicPhotoBox", "visitLicPhoto");

    // -------------------------------------------------
    // تكبير الصورة (Lightbox) بنافذة تفاصيل الزيارة
    // -------------------------------------------------
    const lightboxOverlay = document.getElementById("lightboxOverlay");
    function openLightbox(url) {
      document.getElementById("lightboxImg").src = url;
      lightboxOverlay.style.display = "flex";
    }
    function closeLightbox() {
      lightboxOverlay.style.display = "none";
      document.getElementById("lightboxImg").src = "";
    }
    document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
    lightboxOverlay.addEventListener("click", (e) => {
      if (e.target === lightboxOverlay) closeLightbox();
    });

    // -------------------------------------------------
    // لوحة المشرف: الواجهة الافتراضية هي "كل الزيارات" دائمًا
    // نموذج التعديل يظهر فقط مؤقتًا عند الضغط على "تعديل" بنافذة التفاصيل
    // -------------------------------------------------
    const registerTab = document.getElementById("registerTab");
    const allVisitsTab = document.getElementById("allVisitsTab");

    function showList() {
      registerTab.style.display = "none";
      allVisitsTab.style.display = "block";
      renderMonths();
    }
    function showEditForm() {
      allVisitsTab.style.display = "none";
      registerTab.style.display = "block";
    }

    function fillSelect(select, items, placeholder) {
      select.innerHTML = placeholder ? `<option value="">${placeholder}</option>` : "";
      items.forEach((it) => {
        const opt = document.createElement("option");
        opt.value = it.id;
        opt.textContent = it.name;
        select.appendChild(opt);
      });
    }

    // -------------------------------------------------
    // تسجيل/تعديل زيارة (نفس منطق صفحة المفتش، والمفتش هنا هو المشرف نفسه)
    // -------------------------------------------------
    // لوحة المشرف: النموذج يُستخدم للتعديل فقط، فبعد الحفظ أو الإلغاء نرجع للقائمة مباشرة
    // -------------------------------------------------
    // حقل "تاريخ آخر زيارة" — يظهر فقط لحالة "لم تكتمل المدة" تحديدًا (بالاسم)
    // -------------------------------------------------
    function isIncompleteDurationStatus(statusId) {
      const s = statuses.find((x) => x.id === statusId);
      return !!s && s.name === "لم تكتمل المدة";
    }
    function updateLastVisitDateVisibility() {
      const show = isIncompleteDurationStatus(document.getElementById("visitStatus").value);
      document.getElementById("lastVisitDateField").style.display = show ? "flex" : "none";
    }
    document.getElementById("visitStatus").addEventListener("change", updateLastVisitDateVisibility);
    document.getElementById("clearLastVisitDateBtn").addEventListener("click", () => {
      document.getElementById("lastVisitDateInput").value = "";
    });

    function resetRegisterForm() {
      editingVisitId = null;
      document.getElementById("registerError").textContent = "";
      document.getElementById("registerSuccess").textContent = "";
      showList();
    }

    async function openEditVisit(visit) {
      editingVisitId = visit.id;
      // مهم: نستخدم رقم المفتش الأصلي صاحب الزيارة (مو رقم المشرف الحالي) عند رفع صورة
      // بديلة، وإلا يتكوّن مسار جديد بمجلد المشرف ويبقى مسار المفتش الأصلي يتيمًا
      editingVisitInspectorId = visit.inspector_id;
      editingOldEstPath = visit.establishment_photo_path;
      editingOldLicPath = visit.license_photo_path;
      document.getElementById("visitEstablishment").value = visit.establishment_name;
      document.getElementById("visitLicense").value = visit.license_number || "";
      document.getElementById("visitStreet").value = visit.street || "";
      estPhotoBox.reset();
      licPhotoBox.reset();
      if (visit.establishment_photo_path) {
        const url = await getVisitPhotoSignedUrl(visit.establishment_photo_path);
        if (url) estPhotoBox.showExisting(url);
      }
      if (visit.license_photo_path) {
        const url = await getVisitPhotoSignedUrl(visit.license_photo_path);
        if (url) licPhotoBox.showExisting(url);
      }
      document.getElementById("visitStatus").value = visit.status_id || "";
      document.getElementById("lastVisitDateInput").value = visit.last_visit_date || "";
      updateLastVisitDateVisibility();
      document.getElementById("visitArea").value = visit.area_id || "";
      capturedLat = visit.latitude;
      capturedLng = visit.longitude;
      manualLocationUrl = visit.location_url || null;
      document.getElementById("manualLocationField").style.display = "none";
      updateLocationUI();
      document.getElementById("registerError").textContent = "";
      document.getElementById("registerSuccess").textContent = "";
      document.getElementById("saveVisitBtn").textContent = "حفظ التعديل";
      document.getElementById("visitDetailModal").style.display = "none";
      showEditForm();
    }

    document.getElementById("cancelEditVisitBtn").addEventListener("click", resetRegisterForm);

    document.getElementById("saveVisitBtn").addEventListener("click", async () => {
      const errorEl = document.getElementById("registerError");
      const successEl = document.getElementById("registerSuccess");
      errorEl.textContent = "";
      successEl.textContent = "";

      const establishment_name = document.getElementById("visitEstablishment").value.trim();
      const license_number = document.getElementById("visitLicense").value.trim() || null;
      const street = document.getElementById("visitStreet").value.trim() || null;
      const status_id = document.getElementById("visitStatus").value || null;
      // التاريخ ينحفظ فقط لو الحالة المختارة فعليًا "لم تكتمل المدة"، وإلا يُرسل null دائمًا
      const last_visit_date = isIncompleteDurationStatus(status_id)
        ? document.getElementById("lastVisitDateInput").value || null
        : null;
      const area_id = document.getElementById("visitArea").value || null;
      const estFile = estPhotoBox.getFile();
      const licFile = licPhotoBox.getFile();

      if (!establishment_name) {
        errorEl.textContent = "اكتب اسم المنشأة";
        return;
      }
      if (!status_id || !area_id) {
        errorEl.textContent = "اختر حالة الزيارة ونطاقها";
        return;
      }

      const btn = document.getElementById("saveVisitBtn");
      btn.disabled = true;
      try {
        if (editingVisitId) {
          const updates = { establishment_name, license_number, street, status_id, area_id, location_url: manualLocationUrl, last_visit_date };
          if (estFile) {
            updates.establishment_photo_path = await uploadVisitPhoto(estFile, editingVisitInspectorId, editingVisitId, "establishment");
            if (editingOldEstPath && editingOldEstPath !== updates.establishment_photo_path) {
              await deleteVisitPhotoFile(editingOldEstPath); // تنظيف المسار القديم لو كان مختلفًا فعليًا
            }
          } else if (estPhotoBox.wasCleared()) {
            if (editingOldEstPath) await deleteVisitPhotoFile(editingOldEstPath);
            updates.establishment_photo_path = null;
          }
          if (licFile) {
            updates.license_photo_path = await uploadVisitPhoto(licFile, editingVisitInspectorId, editingVisitId, "license");
            if (editingOldLicPath && editingOldLicPath !== updates.license_photo_path) {
              await deleteVisitPhotoFile(editingOldLicPath);
            }
          } else if (licPhotoBox.wasCleared()) {
            if (editingOldLicPath) await deleteVisitPhotoFile(editingOldLicPath);
            updates.license_photo_path = null;
          }
          const updated = await updateVisit(editingVisitId, updates);
          const index = allVisits.findIndex((v) => v.id === editingVisitId);
          if (index !== -1) allVisits[index] = { ...allVisits[index], ...updated };
          successEl.textContent = "تم حفظ التعديل ✓";
          resetRegisterForm();
        } else {
          const visitId = crypto.randomUUID();
          const establishment_photo_path = estFile
            ? await uploadVisitPhoto(estFile, myProfile.id, visitId, "establishment")
            : null;
          const license_photo_path = licFile
            ? await uploadVisitPhoto(licFile, myProfile.id, visitId, "license")
            : null;

          const created = await addVisit({
            id: visitId,
            tool_id: toolId,
            inspector_id: myProfile.id,
            establishment_name,
            license_number,
            street,
            status_id,
            area_id,
            latitude: capturedLat,
            longitude: capturedLng,
            establishment_photo_path,
            license_photo_path,
          });
          allVisits.unshift({
            ...created,
            visit_statuses: statuses.find((s) => s.id === status_id) || null,
            visit_areas: areas.find((a) => a.id === area_id) || null,
            profiles: { full_name: myProfile.full_name, email: myProfile.email },
          });
          successEl.textContent = "تم حفظ الزيارة ✓";
          resetRegisterForm();
        }
      } catch (e) {
        errorEl.textContent = e.message || "تعذّر حفظ الزيارة";
      } finally {
        btn.disabled = false;
      }
    });

    // -------------------------------------------------
    // "كل الزيارات": تجميع بالشهر، بحث وفلترة (+ فلتر المفتش)
    // -------------------------------------------------
    function monthKey(iso) {
      const d = new Date(iso);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }
    // تنسيق ميلادي موحّد بكل الموقع (بدون أي تقويم هجري)
    const GREGORIAN_MONTHS_AR = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
    function monthLabel(iso) {
      const d = new Date(iso);
      return `${GREGORIAN_MONTHS_AR[d.getMonth()]} ${d.getFullYear()}`;
    }
    function formatDateOnly(iso) {
      const d = new Date(iso);
      return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
    }
    function formatTimeOnly(iso) {
      const d = new Date(iso);
      let hours = d.getHours();
      const minutes = String(d.getMinutes()).padStart(2, "0");
      const ampm = hours >= 12 ? "م" : "ص";
      hours = hours % 12 || 12;
      return `${hours}:${minutes} ${ampm}`;
    }
    function formatDateTime(iso) {
      return formatDateOnly(iso) + " — " + formatTimeOnly(iso);
    }
    function inspectorName(v) {
      return (v.profiles && (v.profiles.full_name || v.profiles.email)) || "—";
    }

    let openMonths = new Set();

    // يُستخدم بالعرض وبالتصدير مع بعض، عشان التصدير يصدّر بالضبط نفس اللي ظاهر بالقائمة
    // تحسب حدود الفترة (YYYY-MM-DD) حسب القيمة المختارة بقائمة الفترة
    function toDateInputValue(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    function resolvePeriodRange() {
      const period = document.getElementById("periodSelect").value;
      const now = new Date();
      if (period === "this_month") {
        return {
          from: toDateInputValue(new Date(now.getFullYear(), now.getMonth(), 1)),
          to: toDateInputValue(new Date(now.getFullYear(), now.getMonth() + 1, 0)),
        };
      }
      if (period === "last_month") {
        return {
          from: toDateInputValue(new Date(now.getFullYear(), now.getMonth() - 1, 1)),
          to: toDateInputValue(new Date(now.getFullYear(), now.getMonth(), 0)),
        };
      }
      if (period === "all_time") return { from: "", to: "" };
      // تحديد يدوي: من حقلي التاريخ مباشرة
      return {
        from: document.getElementById("filterDateFrom").value,
        to: document.getElementById("filterDateTo").value,
      };
    }

    function getFilteredVisits() {
      const query = document.getElementById("visitSearchInput").value.trim().toLowerCase();
      const filterAreaId = document.getElementById("filterArea").value;
      const filterStatusId = document.getElementById("filterStatus").value;
      const filterInspectorId = document.getElementById("filterInspector").value;
      const { from: dateFrom, to: dateTo } = resolvePeriodRange();

      return allVisits.filter((v) => {
        if (filterAreaId && v.area_id !== filterAreaId) return false;
        if (filterStatusId && v.status_id !== filterStatusId) return false;
        if (filterInspectorId && v.inspector_id !== filterInspectorId) return false;
        if (dateFrom || dateTo) {
          const visitDay = formatDateOnly(v.visited_at).replaceAll("/", "-"); // YYYY-MM-DD للمقارنة النصية السليمة
          if (dateFrom && visitDay < dateFrom) return false;
          if (dateTo && visitDay > dateTo) return false;
        }
        if (query) {
          const hay = (v.establishment_name + " " + (v.license_number || "")).toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });
    }

    // نص يوضّح الفلاتر الفعّالة وقت التصدير، يُكتب أعلى ورقة "ملخص" بالإكسل
    function buildFilterSummary() {
      const periodLabels = { this_month: "هذا الشهر", last_month: "الشهر الماضي", all_time: "كل الوقت" };
      const periodValue = document.getElementById("periodSelect").value;
      let period;
      if (periodValue === "custom") {
        const { from, to } = resolvePeriodRange();
        period = from || to ? `${(from || "—").replaceAll("-", "/")} – ${(to || "—").replaceAll("-", "/")}` : "الكل";
      } else {
        period = periodLabels[periodValue] || "الكل";
      }

      const areaId = document.getElementById("filterArea").value;
      const areaName = areaId ? (areas.find((a) => a.id === areaId) || {}).name || "—" : "الكل";

      const statusId = document.getElementById("filterStatus").value;
      const statusName = statusId ? (statuses.find((s) => s.id === statusId) || {}).name || "—" : "الكل";

      const inspectorId = document.getElementById("filterInspector").value;
      const inspectorOpt = inspectorId ? [...document.getElementById("filterInspector").options].find((o) => o.value === inspectorId) : null;
      const inspectorName = inspectorId ? (inspectorOpt ? inspectorOpt.textContent : "—") : "الكل";

      return `الفترة: ${period} | النطاق: ${areaName} | الحالة: ${statusName} | المفتش: ${inspectorName}`;
    }

    document.getElementById("exportBtn").addEventListener("click", async () => {
      const statusEl = document.getElementById("exportStatus");
      const btn = document.getElementById("exportBtn");
      const visitsToExport = getFilteredVisits(); // نصدّر بالضبط اللي ظاهر بالقائمة بعد الفلترة
      if (visitsToExport.length === 0) {
        alert("لا توجد زيارات مطابقة للفلترة الحالية لتصديرها");
        return;
      }
      btn.disabled = true;
      statusEl.style.display = "block";
      statusEl.className = "export-status";
      statusEl.textContent = "جارٍ تجهيز ملف التصدير...";
      try {
        const tool = { name: document.getElementById("toolTitle").textContent };
        const includePhotos = document.getElementById("includePhotosToggle").checked;
        const filterSummary = buildFilterSummary();
        await exportVisitsToZip(tool, visitsToExport, statuses, areas, includePhotos, filterSummary, (done, total) => {
          statusEl.textContent = total > 0 ? `جارٍ تجهيز الصور... (${done} من ${total})` : "جارٍ تجهيز ملف التصدير...";
        });
        statusEl.textContent = "تم التصدير ✓";
        setTimeout(() => {
          if (statusEl.textContent === "تم التصدير ✓") statusEl.style.display = "none";
        }, 3000);
      } catch (e) {
        statusEl.className = "export-status error";
        statusEl.textContent = "تعذّر التصدير: " + (e.message || "");
      } finally {
        btn.disabled = false;
      }
    });

    function renderMonths() {
      const filtered = getFilteredVisits();
      const groups = {};
      filtered.forEach((v) => {
        const key = monthKey(v.visited_at);
        if (!groups[key]) groups[key] = [];
        groups[key].push(v);
      });
      const sortedKeys = Object.keys(groups).sort().reverse();

      if (sortedKeys.length > 0 && openMonths.size === 0) openMonths.add(sortedKeys[0]);

      const wrap = document.getElementById("monthsList");
      wrap.innerHTML = "";
      if (sortedKeys.length === 0) {
        wrap.innerHTML = '<div class="empty-hint">لا توجد زيارات مطابقة.</div>';
        return;
      }

      sortedKeys.forEach((key) => {
        const items = groups[key];
        const isOpen = openMonths.has(key);

        const section = document.createElement("div");
        section.className = "month-group";

        const header = document.createElement("button");
        header.type = "button";
        header.className = "month-header";
        header.innerHTML = `<span>${isOpen ? "▼" : "◀"} ${monthLabel(items[0].visited_at)}</span><span class="month-count">${items.length} زيارة</span>`;
        header.addEventListener("click", () => {
          if (openMonths.has(key)) openMonths.delete(key);
          else openMonths.add(key);
          renderMonths();
        });
        section.appendChild(header);

        if (isOpen) {
          const list = document.createElement("div");
          list.className = "month-items";
          items.forEach((v) => {
            const row = document.createElement("div");
            row.className = "visit-row";
            row.innerHTML = `
              <div class="visit-row-main">
                <span class="visit-row-name">${escapeHtml(v.establishment_name)}</span>
                <span class="visit-status-badge" style="background:${statusColor(v.status_id)}22;color:${statusColor(v.status_id)}">${escapeHtml(v.visit_statuses ? v.visit_statuses.name : "")}</span>
              </div>
              <div class="visit-row-sub">${formatDateTime(v.visited_at)} · ${escapeHtml(v.visit_areas ? v.visit_areas.name : "")} · ${escapeHtml(inspectorName(v))}</div>
            `;
            row.addEventListener("click", () => openVisitDetail(v));
            list.appendChild(row);
          });
          section.appendChild(list);
        }
        wrap.appendChild(section);
      });
    }

    document.getElementById("visitSearchInput").addEventListener("input", renderMonths);
    document.getElementById("filterArea").addEventListener("change", renderMonths);
    document.getElementById("filterStatus").addEventListener("change", renderMonths);
    document.getElementById("filterInspector").addEventListener("change", renderMonths);
    document.getElementById("filterDateFrom").addEventListener("change", renderMonths);
    document.getElementById("filterDateTo").addEventListener("change", renderMonths);
    document.getElementById("periodSelect").addEventListener("change", () => {
      document.getElementById("customDateRow").style.display = document.getElementById("periodSelect").value === "custom" ? "flex" : "none";
      renderMonths();
    });

    // -------------------------------------------------
    // نافذة تفاصيل الزيارة (+ حذف، للمشرف فقط)
    // -------------------------------------------------
    let detailVisit = null;
    async function openVisitDetail(visit) {
      detailVisit = visit;
      document.getElementById("detailTitle").textContent = visit.establishment_name;
      document.getElementById("detailInspector").textContent = inspectorName(visit);
      document.getElementById("detailStatus").textContent = visit.visit_statuses ? visit.visit_statuses.name : "—";
      const lastVisitRow = document.getElementById("detailLastVisitDateRow");
      if (visit.last_visit_date) {
        document.getElementById("detailLastVisitDate").textContent = visit.last_visit_date.replaceAll("-", "/");
        lastVisitRow.style.display = "flex";
      } else {
        lastVisitRow.style.display = "none";
      }
      document.getElementById("detailArea").textContent = visit.visit_areas ? visit.visit_areas.name : "—";
      document.getElementById("detailLicense").textContent = visit.license_number || "—";
      document.getElementById("detailStreet").textContent = visit.street || "—";
      document.getElementById("detailDate").textContent = formatDateTime(visit.visited_at);

      const locRow = document.getElementById("detailLocationRow");
      const detailLocationUrl = visit.location_url || (visit.latitude && visit.longitude ? `https://maps.google.com/?q=${visit.latitude},${visit.longitude}` : null);
      if (detailLocationUrl) {
        document.getElementById("detailLocationLink").href = detailLocationUrl;
        locRow.style.display = "flex";
      } else {
        locRow.style.display = "none";
      }

      const photosRow = document.getElementById("detailPhotos");
      photosRow.innerHTML = "جارٍ تحميل الصور...";
      const photos = [];
      if (visit.establishment_photo_path) {
        const url = await getVisitPhotoSignedUrl(visit.establishment_photo_path);
        if (url) photos.push(url);
      }
      if (visit.license_photo_path) {
        const url = await getVisitPhotoSignedUrl(visit.license_photo_path);
        if (url) photos.push(url);
      }
      photosRow.innerHTML = "";
      if (photos.length === 0) {
        photosRow.innerHTML = '<span style="font-size:13px;color:var(--text-muted)">لا توجد صور</span>';
      } else {
        photos.forEach((url) => {
          const slot = document.createElement("div");
          slot.className = "case-image-slot";
          slot.style.cursor = "zoom-in";
          slot.innerHTML = `<img src="${escapeHtml(url)}" alt="" />`;
          slot.addEventListener("click", () => openLightbox(url));
          photosRow.appendChild(slot);
        });
      }

      document.getElementById("visitDetailModal").style.display = "flex";
    }
    document.getElementById("closeDetailBtn").addEventListener("click", () => {
      document.getElementById("visitDetailModal").style.display = "none";
    });
    document.getElementById("editVisitBtn").addEventListener("click", async () => {
      if (detailVisit) await openEditVisit(detailVisit);
    });
    document.getElementById("deleteVisitBtn").addEventListener("click", async () => {
      if (!detailVisit) return;
      const confirmed = confirm(`هل أنت متأكد من حذف زيارة "${detailVisit.establishment_name}"؟`);
      if (!confirmed) return;
      try {
        await deleteVisitPhotoFiles(detailVisit); // نحذف الصور أولًا، قبل ما يضيع مسارها بحذف الصف
        await deleteVisit(detailVisit.id);
        allVisits = allVisits.filter((v) => v.id !== detailVisit.id);
        document.getElementById("visitDetailModal").style.display = "none";
        renderMonths();
      } catch (e) {
        alert(e.message || "تعذر حذف الزيارة");
      }
    });

    // ==================================================================
    // تشغيل الصفحة
    // ==================================================================
    (async () => {
      const profile = await requireAuth({ adminOnly: true });
      if (!profile) return;
      myProfile = profile;

      if (!toolId) {
        document.getElementById("toolTitle").textContent = "لم يتم تحديد أداة";
        return;
      }

      const tools = await fetchTools();
      const tool = tools.find((t) => t.id === toolId);
      document.getElementById("toolTitle").textContent = tool ? tool.name : "تسجيل الزيارات";

      statuses = await fetchVisitStatuses(toolId);
      areas = await fetchVisitAreas(toolId);
      fillSelect(document.getElementById("visitStatus"), statuses, null);
      fillSelect(document.getElementById("visitArea"), areas, null);
      fillSelect(document.getElementById("filterStatus"), statuses, "كل الحالات");
      fillSelect(document.getElementById("filterArea"), areas, "كل النطاقات");

      allVisits = await fetchVisits(toolId);

      // تعبئة فلتر المفتشين من المفتشين الفعليين اللي سجّلوا زيارات بهذي الأداة
      const inspectorsMap = new Map();
      allVisits.forEach((v) => {
        if (!inspectorsMap.has(v.inspector_id)) inspectorsMap.set(v.inspector_id, inspectorName(v));
      });
      const filterInspector = document.getElementById("filterInspector");
      inspectorsMap.forEach((name, id) => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = name;
        filterInspector.appendChild(opt);
      });

      document.getElementById("visitTabsWrap").style.display = "block";
      showList();
    })();
  </script>
</body>
</html>
